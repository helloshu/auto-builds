name: FlowZ Auto Build

on:
  schedule:
    - cron: '7 19 * * *' # 每天北京时间 03:07，避开整点高峰
  workflow_dispatch:
    inputs:
      force_tag:
        description: '强制编译指定的 Tag 版本 (例如: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: auto-build-flowz
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-22.04
    outputs:
      has_new_version: ${{ steps.compare.outputs.has_new_version }}
      upstream_tag: ${{ steps.compare.outputs.upstream_tag }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
      release_tag: ${{ steps.compare.outputs.release_tag }}
    steps:
      - name: Compare version with upstream
        id: compare
        shell: bash
        env:
          APP_ID: flowz
          FORCE_TAG: ${{ inputs.force_tag }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: dododook/FlowZ
        run: |
          set -euo pipefail

          if [ -n "$FORCE_TAG" ]; then
            UPSTREAM_TAG="$FORCE_TAG"
          else
            UPSTREAM_TAG=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name // empty' 2>/dev/null || true)
            if [ -z "$UPSTREAM_TAG" ]; then
              UPSTREAM_TAG=$(gh api --paginate "repos/${UPSTREAM_REPO}/tags?per_page=100" --jq '.[].name' \
                | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1)
            fi
          fi

          UPSTREAM_TAG="${UPSTREAM_TAG#refs/tags/}"
          if [ -z "$UPSTREAM_TAG" ] || ! git check-ref-format "refs/tags/${UPSTREAM_TAG}"; then
            echo "::error::无法获取有效的上游标签: ${UPSTREAM_TAG:-<empty>}"
            exit 1
          fi

          ENCODED_UPSTREAM_TAG=$(jq -rn --arg value "$UPSTREAM_TAG" '$value | @uri')
          UPSTREAM_SHA=$(gh api "repos/${UPSTREAM_REPO}/commits/${ENCODED_UPSTREAM_TAG}" --jq '.sha')
          if ! [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::无法把 ${UPSTREAM_TAG} 解析为固定提交 SHA"
            exit 1
          fi

          RELEASE_TAG="${APP_ID}-${UPSTREAM_TAG}"
          {
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$FORCE_TAG" ]; then
            echo "has_new_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ENCODED_RELEASE_TAG=$(jq -rn --arg value "$RELEASE_TAG" '$value | @uri')
          STATUS=$(curl -sS --retry 2 --retry-delay 5 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${ENCODED_RELEASE_TAG}")

          case "$STATUS" in
            200) echo "has_new_version=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "has_new_version=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::检查 ${RELEASE_TAG} 时 GitHub API 返回 HTTP ${STATUS}"
              exit 1
              ;;
          esac

  archive-source:
    name: Archive clean upstream source
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dododook/FlowZ
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: FlowZ
          persist-credentials: false

      - name: Create source archive from tracked files
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          SRC_NAME="FlowZ-${VERSION}-source"
          mkdir -p source-assets
          git -C FlowZ archive --format=tar --prefix="${SRC_NAME}/" HEAD \
            | gzip -n -9 > "source-assets/${SRC_NAME}.tar.gz"
          test -s "source-assets/${SRC_NAME}.tar.gz"

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-flowz
          path: source-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  release:
    name: Build & Package (${{ matrix.platform }})
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-15
            platform: mac
          - os: ubuntu-22.04
            platform: linux

    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dododook/FlowZ
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: FlowZ
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: FlowZ/package-lock.json

      - name: Setup Go (helper, macOS + Windows)
        if: matrix.platform == 'mac' || matrix.platform == 'win'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: FlowZ/helper/go.mod
          cache: false

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential
          sudo gem install --no-document fpm

      - name: Install dependencies
        working-directory: ./FlowZ
        run: npm ci

      - name: Build application
        working-directory: ./FlowZ
        run: npm run build

      - name: Package application
        working-directory: ./FlowZ
        run: npm run package:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          REQUIRE_HELPER: '1'

      - name: Create DMG (macOS, arm64 + x64)
        if: matrix.platform == 'mac'
        working-directory: ./FlowZ
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          for ARCH in arm64 x64; do
            DMG_PATH="dist-package/FlowZ-${VERSION}-mac-${ARCH}.dmg"
            case "$ARCH" in arm64) WANT=arm64 ;; x64) WANT=x86_64 ;; esac
            APP_PATH=""
            for CAND in "dist-package/mac-${ARCH}/FlowZ.app" "dist-package/mac/FlowZ.app"; do
              [ -d "$CAND" ] || continue
              EXE=$(find "$CAND/Contents/MacOS" -maxdepth 1 -type f -print -quit)
              if [ -n "$EXE" ] && lipo -archs "$EXE" | tr ' ' '\n' | grep -qx "$WANT"; then
                APP_PATH="$CAND"
                break
              fi
            done
            if [ -z "$APP_PATH" ]; then
              echo "::error::找不到 ${ARCH}(${WANT}) 架构的 FlowZ.app"
              exit 1
            fi

            codesign --force --deep --sign - "$APP_PATH"
            TEMP_DIR=$(mktemp -d)
            trap 'rm -rf "$TEMP_DIR"' EXIT
            cp -R "$APP_PATH" "$TEMP_DIR/"
            ln -s /Applications "$TEMP_DIR/Applications"
            if [ -f build/macos-dmg-open-guide.txt ]; then
              cp build/macos-dmg-open-guide.txt "$TEMP_DIR/0 首次打开必读 READ ME FIRST.txt"
            fi
            hdiutil create -volname "FlowZ ${VERSION} (${ARCH})" \
              -srcfolder "$TEMP_DIR" -ov -format UDZO "$DMG_PATH"
            rm -rf "$TEMP_DIR"
            trap - EXIT
          done

      - name: Collect and verify platform artifacts
        shell: bash
        working-directory: ./FlowZ
        env:
          PLATFORM: ${{ matrix.platform }}
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          mkdir -p release-assets

          copy_required() {
            local source=$1
            if [ ! -s "$source" ]; then
              echo "::error::缺少预期产物: $source"
              exit 1
            fi
            cp "$source" release-assets/
          }

          case "$PLATFORM" in
            win)
              copy_required "dist-package/FlowZ-${VERSION}-win-x64-setup.exe"
              copy_required "dist-package/FlowZ-${VERSION}-win-x64-portable.exe"
              ;;
            mac)
              copy_required "dist-package/FlowZ-${VERSION}-mac-arm64.dmg"
              copy_required "dist-package/FlowZ-${VERSION}-mac-x64.dmg"
              ;;
            linux)
              copy_required "dist-package/FlowZ-${VERSION}-linux-x86_64.AppImage"
              copy_required "dist-package/FlowZ-${VERSION}-linux-amd64.deb"
              ;;
            *)
              echo "::error::未知平台: $PLATFORM"
              exit 1
              ;;
          esac

      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: FlowZ/release-assets/*
          if-no-files-found: error
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: [check-version, archive-source, release]
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify complete artifact manifest
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          EXPECTED=(
            "FlowZ-${VERSION}-win-x64-setup.exe"
            "FlowZ-${VERSION}-win-x64-portable.exe"
            "FlowZ-${VERSION}-mac-arm64.dmg"
            "FlowZ-${VERSION}-mac-x64.dmg"
            "FlowZ-${VERSION}-linux-x86_64.AppImage"
            "FlowZ-${VERSION}-linux-amd64.deb"
            "FlowZ-${VERSION}-source.tar.gz"
          )

          for name in "${EXPECTED[@]}"; do
            COUNT=$(find artifacts -type f -name "$name" | wc -l)
            if [ "$COUNT" -ne 1 ]; then
              echo "::error::产物 $name 的数量应为 1，实际为 $COUNT"
              exit 1
            fi
          done

          ACTUAL_COUNT=$(find artifacts -type f | wc -l)
          if [ "$ACTUAL_COUNT" -ne "${#EXPECTED[@]}" ]; then
            echo "::error::发现未列入清单的产物；预期 ${#EXPECTED[@]} 个，实际 $ACTUAL_COUNT 个"
            find artifacts -type f -print
            exit 1
          fi

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          CHECKSUM_FILE=$(mktemp)
          cd artifacts
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$CHECKSUM_FILE"
          mv "$CHECKSUM_FILE" SHA256SUMS
          test -s SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/**/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: FlowZ ${{ needs.check-version.outputs.upstream_tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Automated build of [dododook/FlowZ ${{ needs.check-version.outputs.upstream_tag }}](https://github.com/dododook/FlowZ/releases/tag/${{ needs.check-version.outputs.upstream_tag }}).

            Upstream commit: `${{ needs.check-version.outputs.upstream_sha }}`
            SHA-256 checksums are included in `SHA256SUMS`; GitHub build provenance is attached to the artifacts.
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
