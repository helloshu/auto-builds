name: FlowZ Auto Build

on:
  schedule:
    - cron: '0 19 * * *' # 每天北京时间 03:00 自动检测
  workflow_dispatch:
    inputs:
      force_tag:
        description: '强制编译指定的 Tag 版本 (例如: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      has_new_version: ${{ steps.compare.outputs.has_new_version }}
      latest_tag: ${{ steps.compare.outputs.latest_tag }}
    steps:
      - name: Compare version with upstream
        id: compare
        run: |
          UPSTREAM_TAG=$(curl -sL https://api.github.com/repos/dododook/FlowZ/releases/latest | grep '"tag_name":' | sed -E 's/.*"tag_name": "([^"]+)".*/\1/')
          if [ -z "$UPSTREAM_TAG" ]; then
            UPSTREAM_TAG=$(curl -sL https://api.github.com/repos/dododook/FlowZ/tags | grep '"name":' | head -n 1 | sed -E 's/.*"name": "([^"]+)".*/\1/')
          fi
          
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "错误: 无法获取上游 dododook/FlowZ 的任何版本号！"
            exit 1
          fi

          FORCE_TAG="${{ github.event.inputs.force_tag }}"
          if [ -n "$FORCE_TAG" ]; then
            echo "has_new_version=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$FORCE_TAG" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          MY_TAG=$(curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases/latest" | grep '"tag_name":' | sed -E 's/.*"tag_name": "([^"]+)".*/\1/' || echo "")
          
          if [ "$UPSTREAM_TAG" != "$MY_TAG" ]; then
            echo "has_new_version=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          else
            echo "has_new_version=false" >> $GITHUB_OUTPUT
          fi

  release:
    name: Build & Package (${{ matrix.platform }})
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-14
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: 'dododook/FlowZ'
          ref: ${{ needs.check-version.outputs.latest_tag }}
          path: 'FlowZ'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'FlowZ/package-lock.json'

      - name: Setup Go (提权 helper, mac + win)
        if: matrix.platform == 'mac' || matrix.platform == 'win'
        uses: actions/setup-go@v5
        with:
          go-version-file: FlowZ/helper/go.mod
          cache: false

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential
          sudo gem install --no-document fpm

      - name: Install dependencies
        working-directory: ./FlowZ
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
        run: npm ci

      - name: Build application
        working-directory: ./FlowZ
        run: npm run build

      - name: Package application
        working-directory: ./FlowZ
        run: npm run package:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          REQUIRE_HELPER: "1"
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Create DMG (macOS, arm64 + x64)
        if: matrix.platform == 'mac'
        working-directory: ./FlowZ
        run: |
          VERSION=${{ needs.check-version.outputs.latest_tag }}
          VERSION=${VERSION#refs/tags/v}
          VERSION=${VERSION#v}
          for ARCH in arm64 x64; do
            DMG_PATH="dist-package/FlowZ-${VERSION}-mac-${ARCH}.dmg"
            case "$ARCH" in arm64) WANT=arm64 ;; x64) WANT=x86_64 ;; esac
            APP_PATH=""
            for CAND in "dist-package/mac-${ARCH}/FlowZ.app" "dist-package/mac/FlowZ.app"; do
              [ -d "$CAND" ] || continue
              EXE=$(ls "$CAND"/Contents/MacOS/* 2>/dev/null | head -1)
              if [ -n "$EXE" ] && lipo -archs "$EXE" 2>/dev/null | tr ' ' '\n' | grep -qx "$WANT"; then
                APP_PATH="$CAND"; break
              fi
            done
            if [ -z "$APP_PATH" ]; then
              echo "::error::找不到 ${ARCH}(${WANT}) 架构的 FlowZ.app（查了 dist-package/mac-${ARCH}/ 与 dist-package/mac/）——发布将缺 mac-${ARCH} 包，请检查 package:mac 的 electron-builder --${ARCH} 产出。"
              exit 1
            fi
            echo "Using ${ARCH} app bundle: $APP_PATH"
            echo "Ad-hoc deep signing ${ARCH} app bundle (fix Team ID mismatch)..."
            codesign --force --deep --sign - "$APP_PATH"

            echo "Creating ${ARCH} DMG..."
            TEMP_DIR=$(mktemp -d)
            cp -R "$APP_PATH" "$TEMP_DIR/"
            ln -s /Applications "$TEMP_DIR/Applications"
            if [ -f "build/macos-dmg-open-guide.txt" ]; then
              cp "build/macos-dmg-open-guide.txt" "$TEMP_DIR/0 首次打开必读 READ ME FIRST.txt"
            fi
            hdiutil create -volname "FlowZ ${VERSION} (${ARCH})" \
              -srcfolder "$TEMP_DIR" \
              -ov -format UDZO \
              "$DMG_PATH"
            rm -rf "$TEMP_DIR"
            echo "Created: $DMG_PATH"
          done

      - name: Archive source code
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: ./FlowZ
        run: |
          VERSION=${{ needs.check-version.outputs.latest_tag }}
          VERSION=${VERSION#refs/tags/v}
          VERSION=${VERSION#v}
          SRC_NAME="FlowZ-${VERSION}-source"
          mkdir -p "dist-package/${SRC_NAME}"
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist-package' \
            ./ "dist-package/${SRC_NAME}/"
          cd dist-package
          tar czf "FlowZ-${VERSION}-source.tar.gz" "${SRC_NAME}"
          rm -rf "${SRC_NAME}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            FlowZ/dist-package/*.exe
            FlowZ/dist-package/*.dmg
            FlowZ/dist-package/*.AppImage
            FlowZ/dist-package/*.deb
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: [check-version, release]
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.latest_tag }}
          name: Release ${{ needs.check-version.outputs.latest_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
