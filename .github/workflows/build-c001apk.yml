name: c001apk Auto Build

on:
  schedule:
    - cron: '27 20 * * *' # 每天北京时间 04:27，避开整点高峰
  workflow_dispatch:
    inputs:
      force_tag:
        description: '强制编译指定的 Tag 版本 (例如: 1.5.2-release)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: auto-build-c001apk
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-24.04
    outputs:
      has_new_version: ${{ steps.compare.outputs.has_new_version }}
      upstream_tag: ${{ steps.compare.outputs.upstream_tag }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
      release_tag: ${{ steps.compare.outputs.release_tag }}
      semver: ${{ steps.compare.outputs.semver }}
    steps:
      - name: Compare version with upstream
        id: compare
        shell: bash
        env:
          APP_ID: c001apk
          FORCE_TAG: ${{ inputs.force_tag }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: TG-Twilight/c001apk
        run: |
          set -euo pipefail

          TAG_RE='^[0-9]+\.[0-9]+\.[0-9]+-release$'

          if [ -n "$FORCE_TAG" ]; then
            UPSTREAM_TAG="$FORCE_TAG"
          else
            UPSTREAM_TAG=$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=50" \
              --jq '.[] | select((.draft | not) and (.prerelease | not)) | .tag_name' \
              | grep -E "$TAG_RE" \
              | sort -V \
              | tail -n 1 || true)
          fi

          UPSTREAM_TAG="${UPSTREAM_TAG#refs/tags/}"
          if [ -z "$UPSTREAM_TAG" ] || ! git check-ref-format "refs/tags/${UPSTREAM_TAG}"; then
            echo "::error::无法获取有效的上游标签: ${UPSTREAM_TAG:-<empty>}"
            exit 1
          fi
          if ! [[ "$UPSTREAM_TAG" =~ $TAG_RE ]]; then
            echo "::error::上游标签 ${UPSTREAM_TAG} 不符合正式版格式 X.Y.Z-release"
            exit 1
          fi

          SEMVER="${UPSTREAM_TAG%-release}"
          ENCODED_UPSTREAM_TAG=$(jq -rn --arg value "$UPSTREAM_TAG" '$value | @uri')
          UPSTREAM_SHA=$(gh api "repos/${UPSTREAM_REPO}/commits/${ENCODED_UPSTREAM_TAG}" --jq '.sha')
          if ! [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::无法把 ${UPSTREAM_TAG} 解析为固定提交 SHA"
            exit 1
          fi

          RELEASE_TAG="${APP_ID}-${UPSTREAM_TAG}"
          {
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "release_tag=$RELEASE_TAG"
            echo "semver=$SEMVER"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$FORCE_TAG" ]; then
            echo "has_new_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ENCODED_RELEASE_TAG=$(jq -rn --arg value "$RELEASE_TAG" '$value | @uri')
          STATUS=$(curl -sS --retry 2 --retry-delay 5 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${ENCODED_RELEASE_TAG}")

          case "$STATUS" in
            200) echo "has_new_version=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "has_new_version=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::检查 ${RELEASE_TAG} 时 GitHub API 返回 HTTP ${STATUS}"
              exit 1
              ;;
          esac

  validate-android-signing:
    name: Validate Android release signing secrets
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Require a persistent Android signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少必需的 Android 签名 Secret: $name"
              exit 1
            fi
          done

  archive-source:
    name: Archive clean upstream source
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    outputs:
      pubspec_version: ${{ steps.meta.outputs.pubspec_version }}
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TG-Twilight/c001apk
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: app-src
          persist-credentials: false

      - name: Read pubspec version and create clean source archive
        id: meta
        shell: bash
        env:
          SEMVER: ${{ needs.check-version.outputs.semver }}
        run: |
          set -euo pipefail
          PUBSPEC_VER=$(sed -n 's/^version:[[:space:]]*//p' app-src/apps/flutter/pubspec.yaml | tr -d '\r' | head -n 1)
          if ! [[ "$PUBSPEC_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::无法解析有效的 pubspec version: ${PUBSPEC_VER:-<empty>}"
            exit 1
          fi
          echo "pubspec_version=$PUBSPEC_VER" >> "$GITHUB_OUTPUT"

          SRC_NAME="c001apk-${SEMVER}-source"
          mkdir -p source-assets
          git -C app-src archive --format=tar --prefix="${SRC_NAME}/" HEAD \
            | gzip -n -9 > "source-assets/${SRC_NAME}.tar.gz"
          test -s "source-assets/${SRC_NAME}.tar.gz"

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-c001apk
          path: source-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  build-desktop:
    name: Build (${{ matrix.platform }}-x86_64)
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
          - platform: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TG-Twilight/c001apk
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: app-src
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install dependencies and build desktop release (public implementation)
        working-directory: ./app-src/apps/flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter build ${{ matrix.platform }} --release --no-pub

      - name: Package Windows runtime
        if: runner.os == 'Windows'
        working-directory: ./app-src/apps/flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version: ').Line -replace '^version: ', '').Trim()
          $runtime = 'build/windows/x64/runner/Release'
          foreach ($file in @('c001apk.exe', 'flutter_windows.dll', 'data/icudtl.dat', 'data/app.so')) {
            if (!(Test-Path -LiteralPath "$runtime/$file")) { throw "Missing runtime file: $file" }
          }
          New-Item -ItemType Directory -Force -Path ../../release-assets | Out-Null
          $archive = "c001apk-$version-windows-x86_64.zip"
          Compress-Archive -Path "$runtime/*" -DestinationPath "../../release-assets/$archive"

      - name: Package Linux runtime
        if: runner.os == 'Linux'
        working-directory: ./app-src/apps/flutter
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r')
          bundle=build/linux/x64/release/bundle
          test -x "$bundle/c001apk"
          test -f "$bundle/lib/libflutter_linux_gtk.so"
          test -f "$bundle/lib/libapp.so"
          test -f "$bundle/data/icudtl.dat"
          mkdir -p ../../release-assets
          archive="c001apk-${version}-linux-x86_64.tar.gz"
          tar -czf "../../release-assets/${archive}" -C "$bundle" .
          test -s "../../release-assets/${archive}"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-c001apk-${{ matrix.platform }}
          path: app-src/release-assets/*
          if-no-files-found: error
          retention-days: 5

  build-android:
    name: Build Android APKs (3 ABIs)
    needs: [check-version, validate-android-signing]
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TG-Twilight/c001apk
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: app-src
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android SDK API 37 & NDK and build split-per-abi APKs
        working-directory: ./app-src/apps/flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics --jdk-dir="$JAVA_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'

          flutter pub get --enforce-lockfile

          # Generate an ephemeral throwaway keystore to satisfy upstream preBuild guard
          # without exposing real release signing secrets to the Gradle build job.
          TEMP_KS_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_KS_DIR"' EXIT
          keytool -genkeypair -keystore "$TEMP_KS_DIR/ephemeral.jks" \
            -alias temp -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ephemeral123 -keypass ephemeral123 \
            -dname "CN=Ephemeral,O=Build,C=US" >/dev/null 2>&1

          KEYSTORE="$TEMP_KS_DIR/ephemeral.jks" \
          KEY_ALIAS="temp" \
          REVIA_KS_PASS="ephemeral123" \
          flutter build apk --release --split-per-abi

          git diff --exit-code -- pubspec.lock

          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r')
          mkdir -p ../../android-build-input
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -s "$apk"
            cp "$apk" "../../android-build-input/c001apk-${version}-android-${abi}-input.apk"
          done

      - name: Upload Android signing inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-input-c001apk
          path: app-src/android-build-input/*.apk
          if-no-files-found: error
          retention-days: 1

  sign-android:
    name: Sign Android APKs in isolated job
    needs: [check-version, archive-source, build-android]
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android build tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Download Android signing inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-build-input-c001apk
          path: android-input

      - name: Re-sign and verify release APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBSPEC_VER: ${{ needs.archive-source.outputs.pubspec_version }}
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends zip

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS" ]; then
            sdkmanager 'build-tools;37.0.0'
            BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          fi
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          SIGNING_DIR=$(mktemp -d)
          trap 'rm -rf "$SIGNING_DIR"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/release.jks"
          mkdir -p release-assets

          for abi in arm64-v8a armeabi-v7a x86_64; do
            INPUT="android-input/c001apk-${PUBSPEC_VER}-android-${abi}-input.apk"
            test -s "$INPUT"
            cp "$INPUT" "$SIGNING_DIR/${abi}-unsigned.apk"
            zip -d "$SIGNING_DIR/${abi}-unsigned.apk" \
              'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' >/dev/null 2>&1 || true
            "$ZIPALIGN" -f -p 4 "$SIGNING_DIR/${abi}-unsigned.apk" "$SIGNING_DIR/${abi}-aligned.apk"

            OUTPUT="release-assets/c001apk-${PUBSPEC_VER}-android-${abi}.apk"
            "$APKSIGNER" sign \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks "$SIGNING_DIR/release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$OUTPUT" \
              "$SIGNING_DIR/${abi}-aligned.apk"
            "$APKSIGNER" verify --verbose --print-certs "$OUTPUT"
            test -s "$OUTPUT"
          done

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-c001apk-android
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 5

  build-ios:
    name: Build iOS arm64 unsigned IPA
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TG-Twilight/c001apk
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: app-src
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build and package unsigned arm64 IPA
        working-directory: ./app-src/apps/flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign --no-pub

          xcrun lipo build/ios/iphoneos/Runner.app/Runner -verify_arch arm64
          test ! -f build/ios/iphoneos/Runner.app/embedded.mobileprovision

          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r')
          OUT_DIR="$(cd ../.. && pwd)/release-assets"
          mkdir -p "$OUT_DIR" build/ios-staging/Payload
          ditto build/ios/iphoneos/Runner.app build/ios-staging/Payload/Runner.app
          archive="c001apk-${version}-ios-arm64-unsigned.ipa"
          (cd build/ios-staging && ditto -c -k --keepParent Payload "${OUT_DIR}/${archive}")
          unzip -t "${OUT_DIR}/${archive}"
          test -s "${OUT_DIR}/${archive}"

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-c001apk-ios
          path: app-src/release-assets/*.ipa
          if-no-files-found: error
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: [check-version, archive-source, build-desktop, sign-android, build-ios]
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Download source archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: source-*
          merge-multiple: true

      - name: Verify complete artifact manifest
        shell: bash
        env:
          PUBSPEC_VER: ${{ needs.archive-source.outputs.pubspec_version }}
          SEMVER: ${{ needs.check-version.outputs.semver }}
        run: |
          set -euo pipefail
          EXPECTED=(
            "c001apk-${PUBSPEC_VER}-android-arm64-v8a.apk"
            "c001apk-${PUBSPEC_VER}-android-armeabi-v7a.apk"
            "c001apk-${PUBSPEC_VER}-android-x86_64.apk"
            "c001apk-${PUBSPEC_VER}-windows-x86_64.zip"
            "c001apk-${PUBSPEC_VER}-linux-x86_64.tar.gz"
            "c001apk-${PUBSPEC_VER}-ios-arm64-unsigned.ipa"
            "c001apk-${SEMVER}-source.tar.gz"
          )

          for name in "${EXPECTED[@]}"; do
            COUNT=$(find artifacts -type f -name "$name" | wc -l)
            if [ "$COUNT" -ne 1 ]; then
              echo "::error::产物 $name 的数量应为 1，实际为 $COUNT"
              exit 1
            fi
          done

          ACTUAL_COUNT=$(find artifacts -type f | wc -l)
          if [ "$ACTUAL_COUNT" -ne "${#EXPECTED[@]}" ]; then
            echo "::error::发现未列入清单的产物；预期 ${#EXPECTED[@]} 个，实际 $ACTUAL_COUNT 个"
            find artifacts -type f -print
            exit 1
          fi

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          CHECKSUM_FILE=$(mktemp)
          cd artifacts
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$CHECKSUM_FILE"
          mv "$CHECKSUM_FILE" SHA256SUMS
          test -s SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/**/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: c001apk ${{ needs.check-version.outputs.upstream_tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Automated build of [TG-Twilight/c001apk ${{ needs.check-version.outputs.upstream_tag }}](https://github.com/TG-Twilight/c001apk/releases/tag/${{ needs.check-version.outputs.upstream_tag }}) (public implementation).

            Upstream commit: `${{ needs.check-version.outputs.upstream_sha }}`
            - Android (`arm64-v8a`, `armeabi-v7a`, `x86_64`): signed with this repository's persistent Android release certificate.
            - Windows (`x86_64`), Linux (`x86_64` bundle), and iOS (`arm64` unsigned IPA).

            SHA-256 checksums are included in `SHA256SUMS`; GitHub build provenance is attached to the artifacts.
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
