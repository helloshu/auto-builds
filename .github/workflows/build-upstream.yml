name: Auto Build Upstream RSSH (All Platforms)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # 任务 1：版本检测
  check-update:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check_release.outputs.skip }}
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: 获取上游最新 Tag
        id: get_tag
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/shihuili1218/rssh/tags | jq -r '.[0].name')
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: 检查当前仓库是否已发布
        id: check_release
        run: |
          status_code=$(curl -o /dev/null -s -w "%{http_code}\n" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.get_tag.outputs.tag }})
          if [ "$status_code" -eq 200 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  # 任务 2：Ubuntu 机器 (Linux / Android 原生编译)
  build-ubuntu:
    needs: check-update
    if: needs.check-update.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取上游源码
        uses: actions/checkout@v4
        with:
          repository: shihuili1218/rssh
          ref: ${{ needs.check-update.outputs.tag }}

      - name: 配置 Node.js 与缓存
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装系统基础依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl git nasm libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev openjdk-21-jdk

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 配置 Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk

      - name: 修正源码版本号 (Linux sed)
        run: |
          RAW_VERSION=${{ needs.check-update.outputs.tag }}
          VERSION=${RAW_VERSION#v}
          sed -i "s/^version = \"0.0.1\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"0.0.1\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/\"version\": \"0.0.1\"/\"version\": \"$VERSION\"/" package.json

      - name: 编译 Linux 桌面端
        run: |
          npm install
          npm run build
          npx tauri build

      - name: 编译 Android 移动端
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          npx tauri android init
          cd src-tauri
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o gen/android/app/src/main/jniLibs build --release
          cd gen/android
          chmod +x gradlew
          ./gradlew assembleDebug -x rustBuildArm64Debug -x rustBuildArmv7Debug -x rustBuildX86Debug -x rustBuildX86_64Debug

      - name: 收集并发布产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-update.outputs.tag }}
          name: RSSH ${{ needs.check-update.outputs.tag }} (Auto Build)
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            src-tauri/gen/android/app/build/outputs/apk/arm64/debug/*.apk

  # 任务 3：Windows 原生机器编译 (稳定性最强)
  build-windows:
    needs: check-update
    if: needs.check-update.outputs.skip == 'false'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 拉取上游源码
        uses: actions/checkout@v4
        with:
          repository: shihuili1218/rssh
          ref: ${{ needs.check-update.outputs.tag }}

      - name: 配置 Node.js 与缓存
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 修正源码版本号 (Windows PowerShell)
        run: |
          $RAW_VERSION="${{ needs.check-update.outputs.tag }}"
          $VERSION=$RAW_VERSION.TrimStart('v')
          (Get-Content src-tauri/Cargo.toml) -replace '^version = "0.0.1"', "version = `"$VERSION`"" | Set-Content src-tauri/Cargo.toml
          (Get-Content src-tauri/tauri.conf.json) -replace '"version": "0.0.1"', "`"version`": `"$VERSION`"" | Set-Content src-tauri/tauri.conf.json
          (Get-Content package.json) -replace '"version": "0.0.1"', "`"version`": `"$VERSION`"" | Set-Content package.json

      - name: 编译 Windows 桌面端
        run: |
          npm install
          npm run build
          npx tauri build

      - name: 收集并发布产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-update.outputs.tag }}
          files: |
            src-tauri/target/release/rssh.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # 任务 4：macOS 机器 (Apple Silicon & Intel)
  build-macos:
    needs: check-update
    if: needs.check-update.outputs.skip == 'false'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: 拉取上游源码
        uses: actions/checkout@v4
        with:
          repository: shihuili1218/rssh
          ref: ${{ needs.check-update.outputs.tag }}

      - name: 配置 Node.js 与缓存
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 修正源码版本号 (macOS 专属 sed)
        run: |
          RAW_VERSION=${{ needs.check-update.outputs.tag }}
          VERSION=${RAW_VERSION#v}
          sed -i '' "s/^version = \"0.0.1\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i '' "s/\"version\": \"0.0.1\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i '' "s/\"version\": \"0.0.1\"/\"version\": \"$VERSION\"/" package.json

      - name: 编译 macOS Universal 架构应用
        run: |
          npm install
          npm run build
          npx tauri build --target universal-apple-darwin

      - name: 收集并发布 macOS 产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-update.outputs.tag }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
