name: Auto Build Upstream RSSH (Ultimate Edition)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新编译 (跳过已发布检查)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check_release.outputs.skip }}
      tag:  ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: 获取上游最新 Tag
        id: get_tag
        run: |
          LATEST_TAG=$(curl -sS --retry 3 --retry-delay 10 \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/shihuili1218/rssh/tags \
            | jq -r '.[0].name // empty')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "::error::无法获取上游最新 Tag，上游仓库可能没有任何 Tag。"
            exit 1
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "检测到上游最新版本: $LATEST_TAG"

      - name: 检查本仓库是否已发布该版本
        id: check_release
        run: |
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "强制模式已启用，跳过发布检查。"
            exit 0
          fi
          status=$(curl -sS --retry 2 --retry-delay 5 -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.get_tag.outputs.tag }}")
          if [ "$status" -eq 200 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "版本 ${{ steps.get_tag.outputs.tag }} 已发布，跳过本次构建。"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "未发现已有发布，开始构建..."
          fi

  test:
    needs: check-update
    if: needs.check-update.outputs.skip == 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: shihuili1218/rssh
          ref: ${{ needs.check-update.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test-ubuntu-x86_64

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            xdg-utils

      - name: 前端测试 (vitest)
        run: npm test

      - name: 后端测试 (cargo test)
        working-directory: src-tauri
        run: cargo test

  build-desktop:
    needs: [check-update, test]
    if: needs.check-update.outputs.skip == 'false'
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch: aarch64
            cache_key: macos-aarch64
            cross: false
            cli_only: false
            experimental: false

          - os: macos-14
            target: x86_64-apple-darwin
            os_name: macos
            arch: x86_64
            cache_key: macos-x86_64
            cross: false
            cli_only: false
            experimental: false

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
            cache_key: linux-x86_64
            cross: false
            cli_only: false
            experimental: false

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: aarch64
            cache_key: linux-aarch64-native
            cross: false
            cli_only: false
            experimental: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x86_64
            cache_key: windows-x86_64
            cross: false
            cli_only: false
            experimental: false

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            os_name: windows
            arch: aarch64
            cache_key: windows-aarch64
            cross: false
            cli_only: false
            experimental: false

          - os: windows-latest
            target: i686-pc-windows-msvc
            os_name: windows
            arch: i686
            cache_key: windows-i686
            cross: false
            cli_only: false
            experimental: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout 上游源码
        uses: actions/checkout@v4
        with:
          repository: shihuili1218/rssh
          ref: ${{ needs.check-update.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: desktop-${{ matrix.cache_key }}

      - name: 安装 Linux 系统依赖 (glibc / GUI)
        if: runner.os == 'Linux' && matrix.cli_only == false
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            xdg-utils

      - name: 同步版本号
        shell: bash
        run: |
          VERSION="${{ needs.check-update.outputs.tag }}"
          VERSION="${VERSION#v}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          cd src-tauri
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" tauri.conf.json && rm -f tauri.conf.json.bak
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml && rm -f Cargo.toml.bak
          echo "版本同步完成: $VERSION"

      - name: 编译 rssh-cli (Sidecar)
        working-directory: src-tauri
        shell: bash
        run: cargo build --release --features cli --bin rssh-cli --target ${{ matrix.target }}

      - name: 存放 CLI 以备打包
        if: matrix.cli_only == false
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          NAME="rssh-cli"
          if [[ "${{ matrix.target }}" == *windows* ]]; then NAME="rssh-cli.exe"; fi
          cp "src-tauri/target/${{ matrix.target }}/release/${NAME}" src-tauri/bin/

      - name: 编译 Tauri GUI
        if: matrix.cli_only == false && matrix.cross == false
        shell: bash
        run: npx tauri build --target ${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}

      - name: 验证 macOS 代码签名
        if: runner.os == 'macOS' && matrix.cli_only == false && matrix.cross == false
        run: |
          VERSION="${{ needs.check-update.outputs.tag }}"
          VERSION="${VERSION#v}"
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "=== 验证 DMG 签名 ==="
          for dmg in "$BUNDLE"/dmg/*.dmg; do
            if [ -f "$dmg" ]; then
              echo "DMG: $dmg"
              # DMG 本身不签名，检查挂载后的 .app
              hdiutil attach "$dmg" -mountpoint /tmp/rssh_verify -quiet
              codesign --verify --verbose /tmp/rssh_verify/*.app 2>&1 || true
              hdiutil detach /tmp/rssh_verify -quiet
            fi
          done
          echo ""
          echo "=== 验证 .app 签名 ==="
          for app in "$BUNDLE"/macos/*.app; do
            if [ -d "$app" ]; then
              echo "App: $app"
              codesign --verify --verbose=2 "$app" 2>&1 || true
              codesign -dvv "$app" 2>&1 | head -5 || true
            fi
          done

      - name: 重命名并整理安装包产物
        if: matrix.cli_only == false && matrix.cross == false
        shell: bash
        run: |
          VERSION="${{ needs.check-update.outputs.tag }}"
          VERSION="${VERSION#v}"
          # 使用 os_name + arch 动态构建前缀，与原作者命名规范保持一致
          PREFIX="rssh-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}"
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist

          for f in "${BUNDLE}"/dmg/*.dmg;           do [ -f "$f" ] && cp "$f" "dist/${PREFIX}.dmg";       done
          for f in "${BUNDLE}"/deb/*.deb;            do [ -f "$f" ] && cp "$f" "dist/${PREFIX}.deb";       done
          for f in "${BUNDLE}"/rpm/*.rpm;            do [ -f "$f" ] && cp "$f" "dist/${PREFIX}.rpm";       done
          for f in "${BUNDLE}"/appimage/*.AppImage;  do [ -f "$f" ] && cp "$f" "dist/${PREFIX}.AppImage";  done
          for f in "${BUNDLE}"/msi/*.msi;            do [ -f "$f" ] && cp "$f" "dist/${PREFIX}.msi";       done
          for f in "${BUNDLE}"/nsis/*-setup.exe;     do [ -f "$f" ] && cp "$f" "dist/${PREFIX}-setup.exe"; done

          ls -lh dist/ || echo "(dist 目录为空，可能仅构建了 CLI)"

      - name: 打包 CLI Only 产物
        if: matrix.cli_only == true || matrix.cross == true
        shell: bash
        run: |
          VERSION="${{ needs.check-update.outputs.tag }}"
          VERSION="${VERSION#v}"
          mkdir -p dist
          CLI_BIN="src-tauri/target/${{ matrix.target }}/release/rssh-cli"
          if [ -f "$CLI_BIN" ]; then
            tar czf "dist/rssh-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}-cli.tar.gz" \
              -C "$(dirname $CLI_BIN)" "$(basename $CLI_BIN)"
            echo "CLI 压缩包已创建"
          fi
          ls -lh dist/

      - name: 制作 Windows 便携版 ZIP
        if: runner.os == 'Windows' && matrix.cli_only == false
        shell: bash
        run: |
          VERSION="${{ needs.check-update.outputs.tag }}"
          VERSION="${VERSION#v}"
          # ★ 关键：使用 matrix.arch 动态命名，3 个架构完全隔离
          PORTABLE="rssh-${VERSION}-windows-${{ matrix.arch }}-portable"
          REL="src-tauri/target/${{ matrix.target }}/release"
          mkdir -p "${PORTABLE}"
          cp "${REL}/rssh.exe" "${PORTABLE}/"
          cp "${REL}/rssh-cli.exe" "${PORTABLE}/"
          cat > "${PORTABLE}/README.txt" << EOF
          RSSH portable for Windows ${{ matrix.arch }}
          ------------------------------------------------
          Just unzip and run rssh.exe — no installation needed.
          rssh-cli.exe is the CLI binary; add this folder to PATH if you want
          to use \`rssh\` from any terminal.

          Architecture: ${{ matrix.arch }}
          Built from: https://github.com/shihuili1218/rssh @ ${{ needs.check-update.outputs.tag }}
          Built by:   ${{ github.repository }} (auto-build from source)

          WebView2 Runtime requirement:
            - Windows 11 / Windows 10 1803+ : built-in, ready to go.
            - Older / stripped Windows      : install WebView2 Runtime first:
              https://developer.microsoft.com/microsoft-edge/webview2/

          User data is stored under %USERPROFILE%\\.rssh (same as installed
          builds — portable here means "no installer", not "fully isolated").
          EOF
          7z a "dist/${PORTABLE}.zip" "${PORTABLE}/"
          ls -lh dist/

      - name: 发布桌面端产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-update.outputs.tag }}
          name: "RSSH ${{ needs.check-update.outputs.tag }} (Auto Build)"
          draft: false
          prerelease: false
          body: "构建进行中，完整更新说明将在所有平台编译完成后自动生成。"
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: [check-update, test]
    if: needs.check-update.outputs.skip == 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: shihuili1218/rssh
          ref: ${{ needs.check-update.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-universal

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: 注册全部 Android Rust 目标
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: 同步版本号
        shell: bash
        run: |
          VERSION="${{ needs.check-update.outputs.tag }}"
          VERSION="${VERSION#v}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          cd src-tauri
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          echo "版本同步完成: $VERSION"

      - name: 配置 Android 签名
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            > src-tauri/gen/android/key.properties

      - name: 编译 Android APK (全架构)
        run: npx tauri android build --apk
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: 精准提取与重命名 APK
        shell: bash
        run: |
          VERSION="${{ needs.check-update.outputs.tag }}"
          VERSION="${VERSION#v}"
          mkdir -p dist

          BASE="src-tauri/gen/android/app/build/outputs/apk"

          # universal（仅部分 Tauri 版本会产出，有则打包）
          find "$BASE" -type f -path "*/release/*.apk" -name '*universal*.apk' \
            -exec cp {} "dist/rssh-${VERSION}-android-universal.apk" \; 2>/dev/null || true

          # arm64-v8a（主流旗舰 ARM 设备）
          find "$BASE" -type f -path "*/release/*.apk" -name '*arm64-v8a*.apk' \
            -exec cp {} "dist/rssh-${VERSION}-android-arm64.apk" \; 2>/dev/null || true

          # armeabi-v7a（中低端 32-bit ARM 设备）
          find "$BASE" -type f -path "*/release/*.apk" -name '*armeabi-v7a*.apk' \
            -exec cp {} "dist/rssh-${VERSION}-android-armv7.apk" \; 2>/dev/null || true

          # x86_64（Intel/AMD 安卓设备、ChromeOS、模拟器）
          find "$BASE" -type f -path "*/release/*.apk" -name '*x86_64*.apk' \
            -exec cp {} "dist/rssh-${VERSION}-android-x86_64.apk" \; 2>/dev/null || true

          # x86（旧版 x86 模拟器、Intel Atom 平板）
          find "$BASE" -type f -path "*/release/*.apk" -name '*x86-*.apk' \
            -exec cp {} "dist/rssh-${VERSION}-android-x86.apk" \; 2>/dev/null || true

          echo "=== dist/ 产物清单 ==="
          ls -lh dist/ || echo "(无产物)"

      - name: 发布 Android 产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-update.outputs.tag }}
          draft: false
          prerelease: false
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-finalize:
    needs: [check-update, build-desktop, build-android]
    if: needs.check-update.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout 上游源码
        uses: actions/checkout@v4
        with:
          repository: shihuili1218/rssh
          ref: ${{ needs.check-update.outputs.tag }}

      - name: 生成源码压缩包
        run: |
          VERSION="${{ needs.check-update.outputs.tag }}"
          VERSION="${VERSION#v}"
          SRC_NAME="rssh-${VERSION}-source"
          mkdir -p "${SRC_NAME}"
          rsync -a \
            --exclude='.git' \
            --exclude='src-tauri/target' \
            --exclude='node_modules' \
            --exclude='dist' \
            ./ "${SRC_NAME}/"
          tar czf "rssh-${VERSION}-source.tar.gz" "${SRC_NAME}"
          echo "::notice::源码包已生成: rssh-${VERSION}-source.tar.gz ($(du -h rssh-${VERSION}-source.tar.gz | cut -f1))"

      - name: 获取上游 Release 描述
        id: upstream_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.check-update.outputs.tag }}"
          UPSTREAM_BODY=$(gh release view "$TAG" --repo shihuili1218/rssh --json body -q '.body' 2>/dev/null || true)
          if [ -n "$UPSTREAM_BODY" ]; then
            echo "$UPSTREAM_BODY" > /tmp/upstream_notes.md
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新 Release 描述并上传源码
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.check-update.outputs.tag }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          SERVER_URL="${{ github.server_url }}"
          RUN_ID="${{ github.run_id }}"
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")

          cat > /tmp/release_body.md << BODYEOF
          ## 构建信息

          | 项目 | 值 |
          |------|-----|
          | 上游仓库 | [shihuili1218/rssh](https://github.com/shihuili1218/rssh) |
          | 上游版本 | \`${TAG}\` |
          | 编译仓库 | [${REPO}](${SERVER_URL}/${REPO}) |
          | 构建运行 | [#${RUN_ID}](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}) |
          | 构建时间 | ${BUILD_TIME} |
          | 提交哈希 | \`${COMMIT}\` |
          BODYEOF

          if [ -s /tmp/upstream_notes.md ]; then
            echo "" >> /tmp/release_body.md
            cat /tmp/upstream_notes.md >> /tmp/release_body.md
          fi

          cat >> /tmp/release_body.md << BODYEOF

          ---

          > ⚠️ **安全声明**：本 Release 由 ${REPO} 从上游源码自动编译，**非官方发布**。
          > 上游仓库：[shihuili1218/rssh](https://github.com/shihuili1218/rssh) · 版本：\`${TAG}\`
          > 构建时间：${RUN_ID} · 编译环境：GitHub Actions hosted runners
          >
          > **macOS 用户注意**：DMG 使用 ad-hoc 签名（未经过 Apple 公证）。
          > 首次打开时若提示「无法验证开发者」，请右键点击 App → 选择"打开"，
          > 或执行：\`xattr -cr /Applications/rssh.app\`
          BODYEOF

          # ═══ 更新 Release ═══
          gh release edit "$TAG" \
            --repo "$REPO" \
            --title "RSSH ${TAG} (Auto Build)" \
            --notes-file /tmp/release_body.md

          # ═══ 上传源码包 ═══
          gh release upload "$TAG" \
            --repo "$REPO" \
            --clobber \
            "rssh-${VERSION}-source.tar.gz"

          echo "::notice::Release ${TAG} 描述已更新，源码包已上传。"

