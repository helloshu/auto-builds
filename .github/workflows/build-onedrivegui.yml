name: OneDriveGUI Auto Build

on:
  schedule:
    - cron: '3 20 * * *' # 每天北京时间 04:03，避开整点高峰
  workflow_dispatch:
    inputs:
      force_tag:
        description: '强制编译指定的 Tag 版本 (例如: v2.4.0)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: auto-build-onedrivegui
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-24.04
    outputs:
      has_new_version: ${{ steps.compare.outputs.has_new_version }}
      upstream_tag: ${{ steps.compare.outputs.upstream_tag }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
      release_tag: ${{ steps.compare.outputs.release_tag }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - name: Compare version with upstream
        id: compare
        shell: bash
        env:
          APP_ID: onedrivegui
          FORCE_TAG: ${{ inputs.force_tag }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: bpozdena/OneDriveGUI
        run: |
          set -euo pipefail

          TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'

          if [ -n "$FORCE_TAG" ]; then
            UPSTREAM_TAG="$FORCE_TAG"
          else
            UPSTREAM_TAG=$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=50" \
              --jq '.[] | select((.draft | not) and (.prerelease | not)) | .tag_name' \
              | grep -E "$TAG_RE" \
              | sort -V \
              | tail -n 1 || true)
          fi

          UPSTREAM_TAG="${UPSTREAM_TAG#refs/tags/}"
          if [ -z "$UPSTREAM_TAG" ] || ! git check-ref-format "refs/tags/${UPSTREAM_TAG}"; then
            echo "::error::无法获取有效的上游标签: ${UPSTREAM_TAG:-<empty>}"
            exit 1
          fi
          if ! [[ "$UPSTREAM_TAG" =~ $TAG_RE ]]; then
            echo "::error::上游标签 ${UPSTREAM_TAG} 不符合正式版格式 vX.Y.Z"
            exit 1
          fi

          ENCODED_UPSTREAM_TAG=$(jq -rn --arg value "$UPSTREAM_TAG" '$value | @uri')
          UPSTREAM_SHA=$(gh api "repos/${UPSTREAM_REPO}/commits/${ENCODED_UPSTREAM_TAG}" --jq '.sha')
          if ! [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::无法把 ${UPSTREAM_TAG} 解析为固定提交 SHA"
            exit 1
          fi

          VERSION="${UPSTREAM_TAG#v}"
          RELEASE_TAG="${APP_ID}-${UPSTREAM_TAG}"
          {
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "release_tag=$RELEASE_TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$FORCE_TAG" ]; then
            echo "has_new_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ENCODED_RELEASE_TAG=$(jq -rn --arg value "$RELEASE_TAG" '$value | @uri')
          STATUS=$(curl -sS --retry 2 --retry-delay 5 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${ENCODED_RELEASE_TAG}")

          case "$STATUS" in
            200) echo "has_new_version=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "has_new_version=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::检查 ${RELEASE_TAG} 时 GitHub API 返回 HTTP ${STATUS}"
              exit 1
              ;;
          esac

  archive-source:
    name: Archive clean upstream source
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bpozdena/OneDriveGUI
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: odg-src
          persist-credentials: false

      - name: Create source archive from tracked files
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          SRC_NAME="OneDriveGUI-${VERSION}-source"
          mkdir -p source-assets
          git -C odg-src archive --format=tar --prefix="${SRC_NAME}/" HEAD \
            | gzip -n -9 > "source-assets/${SRC_NAME}.tar.gz"
          test -s "source-assets/${SRC_NAME}.tar.gz"

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-onedrivegui
          path: source-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  build-linux:
    name: Build Linux (AppImage, deb, wheel)
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Reclaim unused runner disk space
        shell: bash
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true

      - name: Checkout immutable OneDriveGUI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bpozdena/OneDriveGUI
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: odg-src
          persist-credentials: false

      - name: Checkout pinned abraunegg/onedrive CLI (v2.5.12)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: abraunegg/onedrive
          ref: abbb800775e61508fb6283dfd87cf81d8c2b1f37 # v2.5.12
          path: onedrive-cli-src
          persist-credentials: false

      - name: Build AppImage, Python wheel, and self-contained amd64 deb in Ubuntu Jammy
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          mkdir -p release-assets deb-stage

          cat > build-in-jammy.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export APPIMAGE_EXTRACT_AND_RUN=1

          apt-get update -o Acquire::Retries=3
          apt-get install -y --no-install-recommends \
            binutils \
            ca-certificates \
            curl \
            desktop-file-utils \
            dirmngr \
            dpkg-dev \
            fakeroot \
            file \
            fuse \
            gcc \
            gnupg \
            gtk-update-icon-cache \
            ldc \
            libcurl4-openssl-dev \
            libdbus-1-dev \
            libegl1 \
            libfontconfig1 \
            libfuse2 \
            libgl1 \
            libglib2.0-0 \
            libphobos2-ldc-shared-dev \
            libsqlite3-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            make \
            patchelf \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            squashfs-tools \
            wget \
            xz-utils \
            zstd

          python3 -m pip install --no-cache-dir build setuptools

          # 1. Install appimage-builder v1.1.0 (extracted so no nested FUSE mount is needed)
          curl -fsSL --retry 3 --retry-delay 3 \
            -o /tmp/appimage-builder.AppImage \
            https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          chmod +x /tmp/appimage-builder.AppImage
          (cd /opt && /tmp/appimage-builder.AppImage --appimage-extract >/dev/null)
          mv /opt/squashfs-root /opt/appimage-builder
          ln -sf /opt/appimage-builder/AppRun /usr/local/bin/appimage-builder
          rm -f /tmp/appimage-builder.AppImage

          # 2. Build upstream AppImage & Python wheel
          cd /OneDriveGUI
          chmod +x ./build_appimage.sh
          ./build_appimage.sh

          APPIMAGE_OUT="/OneDriveGUI/OneDriveGUI-${VERSION}-x86_64.AppImage"
          WHEEL_OUT="/OneDriveGUI/dist/onedrive_gui-${VERSION}-py3-none-any.whl"
          test -s "$APPIMAGE_OUT"
          test -s "$WHEEL_OUT"
          cp "$APPIMAGE_OUT" "/release-assets/OneDriveGUI-${VERSION}-x86_64.AppImage"
          cp "$WHEEL_OUT" "/release-assets/onedrive_gui-${VERSION}-py3-none-any.whl"

          # 3. Compile abraunegg/onedrive v2.5.12 (meets OneDriveGUI MIN_CLIENT_VERSION >= 2.5.11)
          rm -rf /tmp/od-build
          cp -a /onedrive-cli-src /tmp/od-build
          rm -rf /tmp/od-build/.git
          cd /tmp/od-build
          echo "v2.5.12" > version
          ./configure \
            --prefix=/usr \
            --without-systemdsystemunitdir \
            --without-systemduserunitdir \
            DC=ldc2
          make -j"$(nproc)" onedrive
          strip -s ./onedrive

          CLI_DIR="/deb-stage/opt/OneDriveGUI/onedrive-cli"
          mkdir -p "$CLI_DIR/lib"
          install -Dm755 ./onedrive "$CLI_DIR/onedrive"
          # Bundle LDC D runtime libraries alongside onedrive so host/Flatpak never needs ldc installed
          ldd ./onedrive | awk '/=> \// {print $3}' | while read -r so_path; do
            base="$(basename "$so_path")"
            case "$base" in
              libphobos2*|libdruntime*|libunwind*|libllvm*)
                cp -L "$so_path" "$CLI_DIR/lib/$base"
                ;;
            esac
          done
          # Drop Debian-specific @CURL_OPENSSL_4 symbol version tags so onedrive loads cleanly
          # on both Debian/Ubuntu and Flatpak org.freedesktop.Platform's libcurl.so.4
          if patchelf --help 2>&1 | grep -q -- '--clear-symbol-version'; then
            CLEAR_ARGS=()
            while IFS= read -r sym; do
              [ -n "$sym" ] && CLEAR_ARGS+=(--clear-symbol-version "$sym")
            done < <(nm -D -u "$CLI_DIR/onedrive" 2>/dev/null | awk '/@CURL_OPENSSL_4$/ {sub(/@.*/, "", $NF); print $NF}' | sort -u)
            if [ "${#CLEAR_ARGS[@]}" -gt 0 ]; then
              patchelf "${CLEAR_ARGS[@]}" "$CLI_DIR/onedrive"
            fi
          fi
          patchelf --set-rpath '$ORIGIN/lib' "$CLI_DIR/onedrive"
          "$CLI_DIR/onedrive" --version | grep -Fq "onedrive v2.5.12"

          # 4. Assemble relocatable Python 3.12 + pruned PySide6_Essentials for the amd64 .deb
          PBS_TAR="cpython-3.12.15+20261021-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          PBS_SHA256="6d7521138fd33afddc1ccd08abb007d9a2829e38117c2576f9efdc0ec73ce772"
          curl -fsSL --retry 3 --retry-delay 3 \
            -o "/tmp/${PBS_TAR}" \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20261021/cpython-3.12.15%2B20261021-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          echo "${PBS_SHA256}  /tmp/${PBS_TAR}" | sha256sum -c -
          mkdir -p /deb-stage/opt/OneDriveGUI
          tar -xzf "/tmp/${PBS_TAR}" -C /deb-stage/opt/OneDriveGUI
          rm -f "/tmp/${PBS_TAR}"

          PY_BIN="/deb-stage/opt/OneDriveGUI/python/bin/python3"
          "$PY_BIN" -m pip install --no-cache-dir -r /OneDriveGUI/requirements.txt
          "$PY_BIN" - <<'PYPRUNE'
          from pathlib import Path
          import shutil, site

          pyside = Path(site.getsitepackages()[0]) / "PySide6"
          for sub in ["Qt/qml", "examples", "Qt/resources", "Qt/translations/qtwebengine_locales"]:
              shutil.rmtree(pyside / sub, ignore_errors=True)
          for tool in ["assistant", "designer", "linguist", "lrelease", "lupdate"]:
              (pyside / tool).unlink(missing_ok=True)
          drop_prefixes = (
              "Qt3D", "QtBluetooth", "QtCharts", "QtConcurrent", "QtDataVisualization",
              "QtDBus", "QtDesigner", "QtHelp", "QtMultimedia", "QtNetwork", "QtOpenGL",
              "QtPositioning", "QtPrintSupport", "QtQml", "QtQuick", "QtRemoteObjects",
              "QtScxml", "QtSensors", "QtSerialPort", "QtSql", "QtStateMachine",
              "QtSvg", "QtTest", "QtWeb", "QtXml",
          )
          for item in list(pyside.iterdir()):
              if item.is_file() and item.name.startswith(drop_prefixes):
                  item.unlink()
          keep_libs = (
              "libQt6OpenGL", "libQt6XcbQpa", "libQt6Wayland", "libQt6Egl",
              "libicudata", "libicuuc", "libicui18n", "libQt6DBus", "libQt6Network",
              "libQt6Qml", "libQt6Core", "libQt6Gui", "libQt6Widgets", "libQt6Svg", "libQt6UiTools",
          )
          qt_lib = pyside / "Qt" / "lib"
          if qt_lib.is_dir():
              for item in list(qt_lib.iterdir()):
                  if not item.name.startswith(keep_libs):
                      if item.is_dir() and not item.is_symlink():
                          shutil.rmtree(item)
                      else:
                          item.unlink()
          PYPRUNE
          "$PY_BIN" -m pip install --no-cache-dir --no-deps "$WHEEL_OUT"
          "$PY_BIN" -c "import PySide6.QtWidgets, onedrive_gui.options as o; assert o.version == '${VERSION}', o.version"

          # Bundle XCB helper libs for minimal distros / Flatpak freedesktop runtime
          mkdir -p /deb-stage/opt/OneDriveGUI/xcb-libs
          for pat in \
            /usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0* \
            /usr/lib/x86_64-linux-gnu/libxcb-icccm.so.4* \
            /usr/lib/x86_64-linux-gnu/libxcb-image.so.0* \
            /usr/lib/x86_64-linux-gnu/libxcb-keysyms.so.1* \
            /usr/lib/x86_64-linux-gnu/libxcb-render-util.so.0* \
            /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so.0*; do
            cp -P $pat /deb-stage/opt/OneDriveGUI/xcb-libs/
          done

          cat > /deb-stage/opt/OneDriveGUI/onedrive-gui <<'EOWRAP'
          #!/bin/sh
          set -eu
          SELF="$(readlink -f "$0")"
          HERE="$(CDPATH= cd -- "$(dirname -- "$SELF")" && pwd)"
          NEED_BUNDLED=1
          if command -v onedrive >/dev/null 2>&1; then
            VER_OUT="$(onedrive --version 2>&1 || true)"
            VER_NUM="$(printf '%s\n' "$VER_OUT" | sed -nE 's/.*onedrive v([0-9]+)\.([0-9]+)\.([0-9]+).*/\1 \2 \3/p' | awk '{printf "%d%02d%02d", $1, $2, $3; exit}')"
            if [ -n "${VER_NUM:-}" ] && [ "$VER_NUM" -ge 20511 ] 2>/dev/null; then
              NEED_BUNDLED=0
            fi
          fi
          if [ "$NEED_BUNDLED" -eq 1 ]; then
            export PATH="$HERE/onedrive-cli:$PATH"
          else
            export PATH="$PATH:$HERE/onedrive-cli"
          fi
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}$HERE/xcb-libs"
          exec "$HERE/python/bin/python3" -m onedrive_gui "$@"
          EOWRAP
          chmod 0755 /deb-stage/opt/OneDriveGUI/onedrive-gui

          mkdir -p /deb-stage/usr/bin /deb-stage/usr/share/applications /deb-stage/usr/share/metainfo /deb-stage/usr/share/icons /deb-stage/DEBIAN
          ln -sf ../../opt/OneDriveGUI/onedrive-gui /deb-stage/usr/bin/onedrive-gui
          install -Dm644 /OneDriveGUI/src/onedrive_gui/resources/OneDriveGUI.desktop /deb-stage/usr/share/applications/OneDriveGUI.desktop
          install -Dm644 /OneDriveGUI/src/onedrive_gui/resources/io.github.bpozdena.onedrivegui.metainfo.xml /deb-stage/usr/share/metainfo/io.github.bpozdena.onedrivegui.metainfo.xml
          cp -r /OneDriveGUI/src/onedrive_gui/resources/images/hicolor /deb-stage/usr/share/icons/

          INSTALLED_KB=$(du -sk /deb-stage/opt /deb-stage/usr | awk '{s+=$1} END {print s}')
          cat > /deb-stage/DEBIAN/control <<EOCONTROL
          Package: onedrive-gui
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_KB}
          Depends: libc6 (>= 2.35), libglib2.0-0, libcurl4, libsqlite3-0, libdbus-1-3, libgl1, libxkbcommon0, libfontconfig1
          Maintainer: Auto-Builds <noreply@github.com>
          Homepage: https://github.com/bpozdena/OneDriveGUI
          Description: A simple GUI for Linux OneDrive Client with multi-account support
           Self-contained build of bpozdena/OneDriveGUI bundling Python 3.12,
           PySide6 Essentials, and fallback abraunegg/onedrive v2.5.12 CLI.
          EOCONTROL

          dpkg-deb -Zxz --build --root-owner-group /deb-stage "/release-assets/OneDriveGUI-${VERSION}-amd64.deb"
          test -s "/release-assets/OneDriveGUI-${VERSION}-amd64.deb"
          EOS
          chmod +x build-in-jammy.sh

          docker run --rm \
            --cap-add SYS_ADMIN \
            --device /dev/fuse \
            --security-opt apparmor:unconfined \
            -e VERSION="$VERSION" \
            -e APPIMAGE_EXTRACT_AND_RUN=1 \
            -v "$PWD/odg-src:/OneDriveGUI" \
            -v "$PWD/onedrive-cli-src:/onedrive-cli-src:ro" \
            -v "$PWD/deb-stage:/deb-stage" \
            -v "$PWD/release-assets:/release-assets" \
            -v "$PWD/build-in-jammy.sh:/build-in-jammy.sh:ro" \
            ubuntu:jammy \
            /build-in-jammy.sh

          ls -lh release-assets/

      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: [check-version, archive-source, build-linux]
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify complete artifact manifest
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          EXPECTED=(
            "OneDriveGUI-${VERSION}-x86_64.AppImage"
            "OneDriveGUI-${VERSION}-amd64.deb"
            "onedrive_gui-${VERSION}-py3-none-any.whl"
            "OneDriveGUI-${VERSION}-source.tar.gz"
          )

          for name in "${EXPECTED[@]}"; do
            COUNT=$(find artifacts -type f -name "$name" | wc -l)
            if [ "$COUNT" -ne 1 ]; then
              echo "::error::产物 $name 的数量应为 1，实际为 $COUNT"
              exit 1
            fi
          done

          ACTUAL_COUNT=$(find artifacts -type f | wc -l)
          if [ "$ACTUAL_COUNT" -ne "${#EXPECTED[@]}" ]; then
            echo "::error::发现未列入清单的产物；预期 ${#EXPECTED[@]} 个，实际 $ACTUAL_COUNT 个"
            find artifacts -type f -print
            exit 1
          fi

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          CHECKSUM_FILE=$(mktemp)
          cd artifacts
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$CHECKSUM_FILE"
          mv "$CHECKSUM_FILE" SHA256SUMS
          test -s SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/**/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.release_tag }}
          target_commitish: ${{ github.ref_name }}
          name: OneDriveGUI ${{ needs.check-version.outputs.upstream_tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Automated build of [bpozdena/OneDriveGUI ${{ needs.check-version.outputs.upstream_tag }}](https://github.com/bpozdena/OneDriveGUI/releases/tag/${{ needs.check-version.outputs.upstream_tag }}).

            Upstream commit: `${{ needs.check-version.outputs.upstream_sha }}`
            - `OneDriveGUI-${{ needs.check-version.outputs.version }}-x86_64.AppImage`: upstream Jammy AppImage recipe (`appimage-builder` v1.1.0).
            - `OneDriveGUI-${{ needs.check-version.outputs.version }}-amd64.deb`: self-contained Debian/Ubuntu & Flatpak `extra-data` package bundling relocatable Python 3.12, PySide6 Essentials, and fallback [abraunegg/onedrive v2.5.12](https://github.com/abraunegg/onedrive/releases/tag/v2.5.12) CLI (`abbb800775e61508fb6283dfd87cf81d8c2b1f37`).
            - `onedrive_gui-${{ needs.check-version.outputs.version }}-py3-none-any.whl`: pure Python wheel.

            SHA-256 checksums are included in `SHA256SUMS`; GitHub build provenance is attached to the artifacts.
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Notify flatpak-hub of new Linux release
        if: env.FLATPAK_HUB_TOKEN != ''
        continue-on-error: true
        shell: bash
        env:
          FLATPAK_HUB_TOKEN: ${{ secrets.FLATPAK_HUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check-version.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          DEB_NAME="OneDriveGUI-${VERSION}-amd64.deb"
          DEB_PATH="artifacts/${DEB_NAME}"
          DEB_SIZE=$(stat -c '%s' "$DEB_PATH")
          DEB_SHA256=$(awk -v f="$DEB_NAME" '$2 == f {print $1; exit}' artifacts/SHA256SUMS)
          DEB_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${DEB_NAME}"
          PAYLOAD=$(jq -nc \
            --arg app_id "io.github.bpozdena.OneDriveGUI" \
            --arg version "$VERSION" \
            --arg url "$DEB_URL" \
            --arg sha256 "$DEB_SHA256" \
            --argjson size "$DEB_SIZE" \
            '{event_type: "upstream-release", client_payload: {app_id: $app_id, version: $version, url: $url, sha256: $sha256, size: $size}}')
          curl -fsSL --retry 2 --retry-delay 3 -X POST \
            -H "Authorization: Bearer ${FLATPAK_HUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/helloshu/flatpak-hub/dispatches" \
            -d "$PAYLOAD"
