name: DSH Go Auto Build

on:
  schedule:
    - cron: '9 20 * * *' # 每天北京时间 04:09，避开整点高峰
  workflow_dispatch:
    inputs:
      force_tag:
        description: '强制编译指定的 Tag 版本 (例如: v1.0.14)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: auto-build-dsh-go
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  NODE_VERSION: '24.22.1'
  GRADLE_VERSION: '9.3.1'
  DSH_MAVEN_MIRRORS: '0'

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-24.04
    outputs:
      has_new_version: ${{ steps.compare.outputs.has_new_version }}
      upstream_tag: ${{ steps.compare.outputs.upstream_tag }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
      release_tag: ${{ steps.compare.outputs.release_tag }}
    steps:
      - name: Compare version with upstream
        id: compare
        shell: bash
        env:
          APP_ID: dsh-go
          FORCE_TAG: ${{ inputs.force_tag }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: ccch1mneyyy/dsh-Go
        run: |
          set -euo pipefail

          TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'

          if [ -n "$FORCE_TAG" ]; then
            UPSTREAM_TAG="$FORCE_TAG"
          else
            UPSTREAM_TAG=$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=50" \
              --jq '.[] | select((.draft | not) and (.prerelease | not)) | .tag_name' \
              | grep -E "$TAG_RE" \
              | sort -V \
              | tail -n 1 || true)
          fi

          UPSTREAM_TAG="${UPSTREAM_TAG#refs/tags/}"
          if [ -z "$UPSTREAM_TAG" ] || ! git check-ref-format "refs/tags/${UPSTREAM_TAG}"; then
            echo "::error::无法获取有效的上游标签: ${UPSTREAM_TAG:-<empty>}"
            exit 1
          fi
          if ! [[ "$UPSTREAM_TAG" =~ $TAG_RE ]]; then
            echo "::error::上游标签 ${UPSTREAM_TAG} 不符合正式版格式 vX.Y.Z"
            exit 1
          fi

          ENCODED_UPSTREAM_TAG=$(jq -rn --arg value "$UPSTREAM_TAG" '$value | @uri')
          UPSTREAM_SHA=$(gh api "repos/${UPSTREAM_REPO}/commits/${ENCODED_UPSTREAM_TAG}" --jq '.sha')
          if ! [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::无法把 ${UPSTREAM_TAG} 解析为固定提交 SHA"
            exit 1
          fi

          RELEASE_TAG="${APP_ID}-${UPSTREAM_TAG}"
          {
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$FORCE_TAG" ]; then
            echo "has_new_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ENCODED_RELEASE_TAG=$(jq -rn --arg value "$RELEASE_TAG" '$value | @uri')
          STATUS=$(curl -sS --retry 2 --retry-delay 5 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${ENCODED_RELEASE_TAG}")

          case "$STATUS" in
            200) echo "has_new_version=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "has_new_version=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::检查 ${RELEASE_TAG} 时 GitHub API 返回 HTTP ${STATUS}"
              exit 1
              ;;
          esac

  validate-android-signing:
    name: Validate Android release signing secrets
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Require a persistent Android signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少必需的 Android 签名 Secret: $name"
              exit 1
            fi
          done

  archive-source:
    name: Archive clean upstream source
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ccch1mneyyy/dsh-Go
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: app-src
          persist-credentials: false

      - name: Create source archive from tracked files
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          SRC_NAME="dsh-go-${VERSION}-source"
          mkdir -p source-assets
          git -C app-src archive --format=tar --prefix="${SRC_NAME}/" HEAD \
            | gzip -n -9 > "source-assets/${SRC_NAME}.tar.gz"
          test -s "source-assets/${SRC_NAME}.tar.gz"

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-dsh-go
          path: source-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  build-android:
    name: Build Android APKs (arm64 + x64)
    needs: [check-version, validate-android-signing]
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Reclaim non-Android runner disk space
        shell: bash
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true

      - name: Install host runtime build dependencies
        shell: bash
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends file gpgv xz-utils zip zstd

      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ccch1mneyyy/dsh-Go
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: app-src
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build bundled Ubuntu + Node + DSH runtime (arm64-v8a & x86_64)
        shell: bash
        working-directory: ./app-src
        run: |
          set -euo pipefail
          # TUNA mirrors frequently return HTTP 403 or throttle US GitHub Actions runners;
          # switch to official Ubuntu/Node/npm upstreams when TUNA is blocked (all SHA-256 & integrity pins remain enforced).
          if ! curl -fsSI --max-time 8 https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports/dists/noble/InRelease >/dev/null 2>&1; then
            echo "Switching Ubuntu runtime mirrors to official global endpoints for US runner..."
            sed -i \
              -e 's|https://mirrors.tuna.tsinghua.edu.cn/ubuntu-cdimage/ubuntu-base/releases/24.04/release|https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release|g' \
              -e 's|https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports|http://ports.ubuntu.com/ubuntu-ports|g' \
              -e 's|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              runtime/build-runtime.sh
          fi
          if ! curl -fsSI --max-time 8 https://registry.npmmirror.com/pnpm >/dev/null 2>&1; then
            echo "Switching Node/npm runtime mirrors to official global endpoints..."
            sed -i \
              -e 's|https://npmmirror.com/mirrors/node|https://nodejs.org/dist|g' \
              -e 's|https://registry.npmmirror.com/-/binary/python-build-standalone|https://github.com/astral-sh/python-build-standalone/releases/download|g' \
              -e 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' \
              runtime/build-runtime.sh
            sed -i 's|https://registry.npmmirror.com|https://registry.npmjs.org|g' runtime/locks/*/package-lock.json
          fi

          # Termux apt repo only retains the latest version of each rolling package;
          # sync PROOT/TALLOC/SHMEM version & SHA-256 pins from the live Termux index when bumped.
          python3 - <<'PYSYNC'
          from pathlib import Path
          import hashlib, re, urllib.request

          script_path = Path("runtime/build-runtime.sh")
          txt = script_path.read_text(encoding="utf-8")
          pkgs = {"aarch64": {}, "x86_64": {}}
          for arch in ("aarch64", "x86_64"):
              url = f"https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-{arch}/Packages"
              raw = urllib.request.urlopen(url, timeout=30).read().decode("utf-8", errors="replace")
              for block in raw.split("\n\n"):
                  kv = dict(line.split(": ", 1) for line in block.splitlines() if ": " in line)
                  if kv.get("Package") in ("proot", "libtalloc", "libandroid-shmem"):
                      pkgs[arch][kv["Package"]] = (kv["Version"], kv["SHA256"])

          new_pins = []
          for var, pkg in [("PROOT_VERSION", "proot"), ("TALLOC_VERSION", "libtalloc"), ("SHMEM_VERSION", "libandroid-shmem")]:
              ver_a64, sha_a64 = pkgs["aarch64"][pkg]
              ver_x64, sha_x64 = pkgs["x86_64"][pkg]
              if ver_a64 != ver_x64:
                  continue
              m = re.search(rf'^{var}="([^"]+)"', txt, re.M)
              if m and m.group(1) != ver_a64:
                  print(f"[termux-sync] {pkg}: {m.group(1)} -> {ver_a64}")
                  txt = re.sub(rf'^{var}="[^"]+"', f'{var}="{ver_a64}"', txt, count=1, flags=re.M)
                  new_pins.append(f"  [{pkg}_{ver_a64}_aarch64.deb]={sha_a64}")
                  new_pins.append(f"  [{pkg}_{ver_a64}_x86_64.deb]={sha_x64}")
                  if pkg == "proot":
                      src_url = f"https://github.com/termux/proot/archive/v{ver_a64}.zip"
                      try:
                          data = urllib.request.urlopen(src_url, timeout=30).read()
                          src_sha = hashlib.sha256(data).hexdigest()
                          new_pins.append(f"  [proot-v{ver_a64}.zip]={src_sha}")
                      except Exception:
                          txt = txt.replace(
                              'proot_src="$CACHE/termux/proot-v$PROOT_VERSION.zip"',
                              f'proot_src="$CACHE/termux/proot-v{m.group(1)}.zip"',
                          ).replace(
                              'https://github.com/termux/proot/archive/v$PROOT_VERSION.zip',
                              f'https://github.com/termux/proot/archive/v{m.group(1)}.zip',
                          ).replace(
                              'pin_of "proot-v$PROOT_VERSION.zip"',
                              f'pin_of "proot-v{m.group(1)}.zip"',
                          )

          if new_pins:
              txt = txt.replace("declare -A PIN=(\n", "declare -A PIN=(\n" + "\n".join(new_pins) + "\n", 1)
              script_path.write_text(txt, encoding="utf-8")
          PYSYNC

          bash runtime/build-runtime.sh arm64-v8a x86_64 \
            || UPDATE_DEB_LOCK=1 bash runtime/build-runtime.sh arm64-v8a x86_64

      - name: Install required Android SDK/NDK components and build APKs
        shell: bash
        working-directory: ./app-src
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"

          GRADLE_EXT=$(grep -rlE 'ndkVersion' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main" | head -n 1)
          NDK_VERSION=$(grep -oE 'ndkVersion[^"]*"[0-9.]+"' "$GRADLE_EXT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          COMPILE_SDK=$(grep -oE 'compileSdkVersion[^0-9]*[0-9]+' "$GRADLE_EXT" | grep -oE '[0-9]+$' | head -n 1)
          echo "Resolved Flutter Android defaults: compileSdk=${COMPILE_SDK:-36}, ndk=${NDK_VERSION}"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${COMPILE_SDK:-36}" "build-tools;${COMPILE_SDK:-36}.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1" \
            || sdkmanager "platforms;android-${COMPILE_SDK:-36}.0" "build-tools;${COMPILE_SDK:-36}.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"

          flutter config --no-analytics --android-sdk "$ANDROID_HOME" --jdk-dir "$JAVA_HOME"
          (
            cd app
            flutter pub get --enforce-lockfile
            printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          )

          # gradlew is gitignored upstream; generate wrapper from pinned Gradle version for Flutter CLI
          (
            cd app/android
            gradle wrapper --gradle-version "$GRADLE_VERSION"
            chmod +x gradlew
          )

          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f all --build-name "$VERSION" --keep-daemon

          mkdir -p android-build-input
          for flavor in arm64 x64; do
            APK="app/build/app/outputs/flutter-apk/app-${flavor}-release.apk"
            test -s "$APK"
            cp "$APK" "android-build-input/dsh-go-${VERSION}-${flavor}-input.apk"
          done

      - name: Upload Android signing inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-input-dsh-go
          path: app-src/android-build-input/*.apk
          if-no-files-found: error
          retention-days: 1

  sign-android:
    name: Sign Android APKs in isolated job
    needs: [check-version, build-android]
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android build tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Download Android signing inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-build-input-dsh-go
          path: android-input

      - name: Re-sign and verify release APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS" ]; then
            sdkmanager 'build-tools;35.0.0'
            BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          fi
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          SIGNING_DIR=$(mktemp -d)
          trap 'rm -rf "$SIGNING_DIR"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/release.jks"
          mkdir -p release-assets

          for flavor in arm64 x64; do
            INPUT="android-input/dsh-go-${VERSION}-${flavor}-input.apk"
            test -s "$INPUT"
            cp "$INPUT" "$SIGNING_DIR/${flavor}-unsigned.apk"
            zip -d "$SIGNING_DIR/${flavor}-unsigned.apk" \
              'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' >/dev/null 2>&1 || true
            "$ZIPALIGN" -f -p 4 "$SIGNING_DIR/${flavor}-unsigned.apk" "$SIGNING_DIR/${flavor}-aligned.apk"

            OUTPUT="release-assets/dsh-go-${VERSION}-${flavor}.apk"
            "$APKSIGNER" sign \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --ks "$SIGNING_DIR/release.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$OUTPUT" \
              "$SIGNING_DIR/${flavor}-aligned.apk"
            "$APKSIGNER" verify --verbose --print-certs "$OUTPUT"
            test -s "$OUTPUT"
          done

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android-dsh-go
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: [check-version, archive-source, sign-android]
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download signed Android artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Download source archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: source-*
          merge-multiple: true

      - name: Verify complete artifact manifest
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          EXPECTED=(
            "dsh-go-${VERSION}-arm64.apk"
            "dsh-go-${VERSION}-x64.apk"
            "dsh-go-${VERSION}-source.tar.gz"
          )

          for name in "${EXPECTED[@]}"; do
            COUNT=$(find artifacts -type f -name "$name" | wc -l)
            if [ "$COUNT" -ne 1 ]; then
              echo "::error::产物 $name 的数量应为 1，实际为 $COUNT"
              exit 1
            fi
          done

          ACTUAL_COUNT=$(find artifacts -type f | wc -l)
          if [ "$ACTUAL_COUNT" -ne "${#EXPECTED[@]}" ]; then
            echo "::error::发现未列入清单的产物；预期 ${#EXPECTED[@]} 个，实际 $ACTUAL_COUNT 个"
            find artifacts -type f -print
            exit 1
          fi

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          CHECKSUM_FILE=$(mktemp)
          cd artifacts
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$CHECKSUM_FILE"
          mv "$CHECKSUM_FILE" SHA256SUMS
          test -s SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/**/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.release_tag }}
          target_commitish: ${{ github.ref_name }}
          name: DSH Go ${{ needs.check-version.outputs.upstream_tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Automated unmodified build of [ccch1mneyyy/dsh-Go ${{ needs.check-version.outputs.upstream_tag }}](https://github.com/ccch1mneyyy/dsh-Go/releases/tag/${{ needs.check-version.outputs.upstream_tag }}) by [@ccch1mneyyy](https://github.com/ccch1mneyyy).

            Upstream commit: `${{ needs.check-version.outputs.upstream_sha }}`
            Android APKs (`arm64-v8a` for phones, `x86_64` for emulators/tablets) with bundled Ubuntu + Node.js + DSH runtime, signed with this repository's persistent Android release key.
            SHA-256 checksums are included in `SHA256SUMS`; GitHub build provenance is attached to the artifacts.

            Source code license: AGPL-3.0 (`sdk/` & `examples/`: MIT); brand & mascot assets belong to [@ccch1mneyyy](https://github.com/ccch1mneyyy) per upstream [`ASSETS.md`](https://github.com/ccch1mneyyy/dsh-Go/blob/${{ needs.check-version.outputs.upstream_sha }}/ASSETS.md). DSH Go is an unofficial community client and is not affiliated with DeepSeek.
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
