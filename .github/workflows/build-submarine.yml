name: Submarine Auto Build & Release

on:
  schedule:
    - cron: '43 22 * * *' # 每天北京时间 06:43，避开整点高峰
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '强制编译指定的上游 Tag 版本 (例: v0.5.0-beta.6 或 v0.5.0)'
        required: false
        default: ''
      expected_sha:
        description: '可选：强制校验上游 40 位 Commit SHA'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: auto-build-submarine
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-24.04
    outputs:
      has_new_version: ${{ steps.compare.outputs.has_new_version }}
      app_id: ${{ steps.compare.outputs.app_id }}
      upstream_tag: ${{ steps.compare.outputs.upstream_tag }}
      upstream_sha: ${{ steps.compare.outputs.upstream_sha }}
      release_tag: ${{ steps.compare.outputs.release_tag }}
      is_prerelease: ${{ steps.compare.outputs.is_prerelease }}
    steps:
      - name: 获取上游最新 Tag (支持 v0.5.* beta 并自然衔接正式版) 并检查本地 Release
        id: compare
        shell: bash
        env:
          APP_ID: submarine
          UPSTREAM_REPO: SinaXhpm/Submarine
          INPUT_TAG: ${{ inputs.upstream_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_RE='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          if [ -n "$INPUT_TAG" ]; then
            UPSTREAM_TAG="$INPUT_TAG"
          else
            RELEASES_JSON=$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=100")
            UPSTREAM_TAG=$(RELEASES_JSON="$RELEASES_JSON" python3 - <<'PY'
          import json, os, re, sys

          releases = json.loads(os.environ["RELEASES_JSON"])
          pat = re.compile(r'^v(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$')

          def semver_key(tag: str):
              m = pat.match(tag)
              if not m:
                  return None
              major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))
              pre = m.group(4)
              if pre is None:
                  return (major, minor, patch, 1, ())
              parts = []
              for p in pre.split('.'):
                  parts.append((0, int(p)) if p.isdigit() else (1, p))
              return (major, minor, patch, 0, tuple(parts))

          candidates = []
          for r in releases:
              if r.get("draft"):
                  continue
              tag = r.get("tag_name") or ""
              m = pat.match(tag)
              if not m:
                  continue
              is_pre = bool(r.get("prerelease")) or (m.group(4) is not None)
              # Track v0.5.* prereleases until v0.5.0+ stable supersedes them by SemVer.
              if is_pre and not tag.startswith("v0.5."):
                  continue
              key = semver_key(tag)
              if key is not None:
                  candidates.append((key, tag))

          if not candidates:
              sys.exit(0)
          candidates.sort(key=lambda item: item[0])
          print(candidates[-1][1])
          PY
            )
          fi

          UPSTREAM_TAG="${UPSTREAM_TAG#refs/tags/}"
          if [ -z "$UPSTREAM_TAG" ] || ! git check-ref-format "refs/tags/${UPSTREAM_TAG}"; then
            echo "::error::无法获取有效的上游标签: ${UPSTREAM_TAG:-<empty>}"
            exit 1
          fi
          if ! [[ "$UPSTREAM_TAG" =~ $TAG_RE ]]; then
            echo "::error::上游标签 ${UPSTREAM_TAG} 不符合语义化版本格式"
            exit 1
          fi

          ENCODED_UPSTREAM_TAG=$(jq -rn --arg value "$UPSTREAM_TAG" '$value | @uri')
          UPSTREAM_SHA=$(gh api "repos/${UPSTREAM_REPO}/commits/${ENCODED_UPSTREAM_TAG}" --jq '.sha')
          if ! [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::无法把 ${UPSTREAM_TAG} 解析为 40 位固定提交 SHA"
            exit 1
          fi

          if [ -n "$EXPECTED_SHA" ]; then
            if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::expected_sha 必须是 40 位小写十六进制 Commit SHA"
              exit 1
            fi
            if [ "$UPSTREAM_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::上游 ${UPSTREAM_TAG} 提交 SHA 不匹配: 预期 ${EXPECTED_SHA}，实际 ${UPSTREAM_SHA}"
              exit 1
            fi
          fi

          IS_PRERELEASE="false"
          if [[ "$UPSTREAM_TAG" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          RELEASE_TAG="${APP_ID}-${UPSTREAM_TAG}"
          {
            echo "app_id=$APP_ID"
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "release_tag=$RELEASE_TAG"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_TAG" ]; then
            echo "has_new_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ENCODED_RELEASE_TAG=$(jq -rn --arg value "$RELEASE_TAG" '$value | @uri')
          STATUS=$(curl -sS --retry 2 --retry-delay 5 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${ENCODED_RELEASE_TAG}")
          case "$STATUS" in
            200) echo "has_new_version=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "has_new_version=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::检查 ${RELEASE_TAG} 时 GitHub API 返回 HTTP ${STATUS}"
              exit 1
              ;;
          esac

  validate-android-signing:
    name: Validate Android release signing secrets
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Require a persistent Android signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少必需的 Android 签名 Secret: $name"
              exit 1
            fi
          done

  archive-source:
    name: Archive clean upstream source
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SinaXhpm/Submarine
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: app-src
          persist-credentials: false

      - name: Create source archive from tracked files
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          SRC_NAME="submarine-${VERSION}-source"
          mkdir -p source-assets
          git -C app-src archive --format=tar --prefix="${SRC_NAME}/" HEAD \
            | gzip -n -9 > "source-assets/${SRC_NAME}.tar.gz"
          test -s "source-assets/${SRC_NAME}.tar.gz"

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-submarine
          path: source-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  build-linux:
    name: Build Linux x86_64 (tar.gz, deb, rpm, AppImage)
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SinaXhpm/Submarine
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: app-src
          persist-credentials: false

      - name: Checkout security patches from auto-builds
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: auto-builds
          persist-credentials: false

      - name: Verify and apply security hardening patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PATCHES=(auto-builds/patches/submarine/*.patch)
          if [ "${#PATCHES[@]}" -eq 0 ]; then
            echo "::error::未找到 Submarine 安全补丁 (patches/submarine/*.patch)"
            exit 1
          fi
          for patch in "${PATCHES[@]}"; do
            echo "Checking patch: $patch"
            git -C app-src apply --check "$PWD/$patch"
            git -C app-src apply "$PWD/$patch"
          done
          git -C app-src diff --exit-code src-tauri/Cargo.toml src-tauri/Cargo.lock package-lock.json

      - name: Setup Node 20 (no cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            patchelf file rpm

      - name: Build Tauri deb/rpm and package tar.gz + SHA-256-verified AppImage
        working-directory: ./app-src
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          # Stamp tauri.conf.json only (never touch Cargo.toml so --locked holds)
          STAMP_VERSION="$VERSION" node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = process.env.STAMP_VERSION;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
          '

          npm ci
          # Never use Tauri appimage bundler (avoids unverified linuxdeploy download)
          npx tauri build --target x86_64-unknown-linux-gnu --bundles deb,rpm -- --locked
          git diff --exit-code src-tauri/Cargo.toml src-tauri/Cargo.lock package-lock.json

          BIN="$PWD/src-tauri/target/x86_64-unknown-linux-gnu/release/submarine"
          test -x "$BIN"
          OUT="$PWD/../release-assets"
          WORK="$RUNNER_TEMP/submarine-linux-pkg"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK" "$OUT"

          # 1. Stage .deb and .rpm
          DEB=$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -type f -name '*.deb' | head -n 1)
          RPM=$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm -type f -name '*.rpm' | head -n 1)
          test -s "$DEB"
          test -s "$RPM"
          cp "$DEB" "$OUT/Submarine-${VERSION}-linux-x86_64.deb"
          cp "$RPM" "$OUT/Submarine-${VERSION}-linux-x86_64.rpm"

          # 2. Portable tar.gz
          TAR_NAME="Submarine-${VERSION}-linux-x86_64"
          mkdir -p "$WORK/$TAR_NAME"
          install -Dm755 "$BIN" "$WORK/$TAR_NAME/submarine"
          strip "$WORK/$TAR_NAME/submarine"
          install -Dm644 packaging/arch/submarine.desktop "$WORK/$TAR_NAME/submarine.desktop"
          install -Dm644 src-tauri/icons/icon.png "$WORK/$TAR_NAME/submarine.png"
          install -Dm644 LICENSE "$WORK/$TAR_NAME/LICENSE"
          tar -C "$WORK" --owner=0 --group=0 -czf "$OUT/Submarine-${VERSION}-linux-x86_64.tar.gz" "$TAR_NAME"

          # 3. SHA-256-verified AppImage (appimagetool 1.9.1 + type2-runtime 20251108)
          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          APPIMAGETOOL_SHA="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          RUNTIME_URL="https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          RUNTIME_SHA="2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"

          curl -fsSL --retry 3 --retry-delay 5 -o "$WORK/appimagetool" "$APPIMAGETOOL_URL"
          echo "${APPIMAGETOOL_SHA}  $WORK/appimagetool" | sha256sum -c -
          chmod 755 "$WORK/appimagetool"

          curl -fsSL --retry 3 --retry-delay 5 -o "$WORK/runtime-x86_64" "$RUNTIME_URL"
          echo "${RUNTIME_SHA}  $WORK/runtime-x86_64" | sha256sum -c -

          APPDIR="$WORK/Submarine.AppDir"
          install -Dm755 "$WORK/$TAR_NAME/submarine" "$APPDIR/usr/bin/submarine"
          install -Dm644 packaging/arch/submarine.desktop "$APPDIR/submarine.desktop"
          install -Dm644 src-tauri/icons/icon.png "$APPDIR/submarine.png"
          ln -s submarine.png "$APPDIR/.DirIcon"
          ln -s usr/bin/submarine "$APPDIR/AppRun"

          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 VERSION="$VERSION" \
            "$WORK/appimagetool" --no-appstream --runtime-file "$WORK/runtime-x86_64" \
            "$APPDIR" "$OUT/Submarine-${VERSION}-linux-x86_64.AppImage"
          test -s "$OUT/Submarine-${VERSION}-linux-x86_64.AppImage"
          ls -la "$OUT"

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-submarine-linux-x86_64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 5

  build-windows:
    name: Build Windows x86_64 (msi, setup.exe, portable.zip)
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SinaXhpm/Submarine
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: app-src
          persist-credentials: false

      - name: Checkout security patches from auto-builds
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: auto-builds
          persist-credentials: false

      - name: Verify and apply security hardening patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PATCHES=(auto-builds/patches/submarine/*.patch)
          if [ "${#PATCHES[@]}" -eq 0 ]; then
            echo "::error::未找到 Submarine 安全补丁"
            exit 1
          fi
          for patch in "${PATCHES[@]}"; do
            echo "Checking patch: $patch"
            git -C app-src apply --check "$PWD/$patch"
            git -C app-src apply "$PWD/$patch"
          done
          git -C app-src diff --exit-code src-tauri/Cargo.toml src-tauri/Cargo.lock package-lock.json

      - name: Setup Node 20 (no cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri MSI, setup.exe (with install/uninstall self-check), and portable zip
        working-directory: ./app-src
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:UPSTREAM_TAG.TrimStart('v')
          $versionStrict = ($version -split '-')[0]
          $target = 'x86_64-pc-windows-msvc'
          $outDir = Join-Path (Resolve-Path '..').Path 'release-assets'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # Stamp tauri.conf.json only (strict semver for WiX MSI; never edit Cargo.toml)
          $env:STAMP_VERSION = $versionStrict
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = process.env.STAMP_VERSION;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
          '
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Seed Tauri WiX directory from preinstalled WiX 3.14 when present
          if ($env:WIX -and (Test-Path (Join-Path $env:WIX 'bin\candle.exe'))) {
            $wixCache = Join-Path $env:LOCALAPPDATA 'tauri\WixTools314'
            New-Item -ItemType Directory -Force -Path $wixCache | Out-Null
            Copy-Item (Join-Path $env:WIX 'bin\*') $wixCache -Recurse -Force
          }

          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          npx tauri build --target $target --bundles msi -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --exit-code src-tauri/Cargo.toml src-tauri/Cargo.lock package-lock.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $appExe = (Resolve-Path "src-tauri\target\$target\release\submarine.exe").Path

          # 1. Stage .msi
          $msi = (Get-ChildItem -Path "src-tauri\target\$target\release\bundle\msi" -Filter '*.msi' | Select-Object -First 1).FullName
          if (-not $msi) { throw "No .msi bundle produced" }
          Copy-Item $msi (Join-Path $outDir "Submarine-$version-windows-x86_64.msi")

          # 2. Build setup.exe (upstream Rust installer when present, else SHA-256-verified NSIS 3.13)
          $setupOut = Join-Path $outDir "Submarine-$version-windows-x86_64-setup.exe"
          if (Test-Path 'packaging\windows\setup\Cargo.toml') {
            Push-Location 'packaging\windows\setup'
            cargo build --release --locked --target $target --bin uninstall
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $payload = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'setup-payload')
            Copy-Item "target\$target\release\uninstall.exe" $payload.FullName
            $env:SUBMARINE_SETUP_APP = $appExe
            $env:SUBMARINE_SETUP_UNINSTALLER = Join-Path $payload.FullName 'uninstall.exe'
            cargo build --release --locked --target $target --bin setup
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "target\$target\release\setup.exe" $setupOut
            Pop-Location
            $checkArgs = @('/S', '/NS', "/D=$env:RUNNER_TEMP\submarine-setup-check")
          } else {
            $nsisUrl = 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip'
            $nsisSha = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
            $nsisZip = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
            $nsisDest = Join-Path $env:RUNNER_TEMP 'nsis'
            Invoke-WebRequest -Uri $nsisUrl -OutFile $nsisZip
            $nsisActual = (Get-FileHash -Path $nsisZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($nsisActual -ne $nsisSha) {
              throw "NSIS 3.13 SHA-256 mismatch: expected $nsisSha, got $nsisActual"
            }
            Expand-Archive -Path $nsisZip -DestinationPath $nsisDest -Force
            $makensis = (Get-ChildItem -Path $nsisDest -Recurse -Filter 'makensis.exe' | Select-Object -First 1).FullName
            if (-not $makensis) { throw "makensis.exe not found under $nsisDest" }

            $iconPath = (Resolve-Path 'src-tauri\icons\icon.ico').Path
            $nsiFile = Join-Path $env:RUNNER_TEMP 'submarine.nsi'
            $nsiLines = @(
              'Unicode true'
              'Name "Submarine"'
              "OutFile `"$setupOut`""
              'InstallDir "$LOCALAPPDATA\Submarine"'
              'RequestExecutionLevel user'
              'SetCompressor /SOLID lzma'
              "Icon `"$iconPath`""
              "UninstallIcon `"$iconPath`""
              'Page directory'
              'Page instfiles'
              'UninstPage confirm'
              'UninstPage instfiles'
              ''
              'Section "Install"'
              '  SetOutPath "$INSTDIR"'
              "  File `"/oname=submarine.exe`" `"$appExe`""
              '  WriteUninstaller "$INSTDIR\uninstall.exe"'
              '  CreateDirectory "$SMPROGRAMS\Submarine"'
              '  CreateShortcut "$SMPROGRAMS\Submarine\Submarine.lnk" "$INSTDIR\submarine.exe"'
              '  WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Submarine" "DisplayName" "Submarine"'
              "  WriteRegStr HKCU `"Software\Microsoft\Windows\CurrentVersion\Uninstall\Submarine`" `"DisplayVersion`" `"$versionStrict`""
              '  WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Submarine" "Publisher" "Submarine"'
              '  WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Submarine" "InstallLocation" "$INSTDIR"'
              '  WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Submarine" "UninstallString" ''"$INSTDIR\uninstall.exe"'''
              'SectionEnd'
              ''
              'Section "Uninstall"'
              '  Delete "$SMPROGRAMS\Submarine\Submarine.lnk"'
              '  RMDir "$SMPROGRAMS\Submarine"'
              '  Delete "$INSTDIR\submarine.exe"'
              '  Delete "$INSTDIR\uninstall.exe"'
              '  RMDir "$INSTDIR"'
              '  DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\Submarine"'
              'SectionEnd'
            )
            $nsiLines -join "`r`n" | Set-Content -Path $nsiFile -Encoding utf8
            & $makensis $nsiFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $checkArgs = @('/S', "/D=$env:RUNNER_TEMP\submarine-setup-check")
          }

          # Silent install -> SHA-256 verify -> registry check -> silent uninstall self-check
          $checkDir = Join-Path $env:RUNNER_TEMP 'submarine-setup-check'
          if (Test-Path $checkDir) { Remove-Item -Recurse -Force $checkDir }
          $p = Start-Process -FilePath $setupOut -ArgumentList $checkArgs -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          $builtHash = (Get-FileHash $appExe -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash (Join-Path $checkDir 'submarine.exe') -Algorithm SHA256).Hash
          if ($builtHash -ne $installedHash) { throw "Installed submarine.exe hash mismatch" }
          $regKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Submarine'
          $dispVer = (Get-ItemProperty $regKey).DisplayVersion
          if ($dispVer -ne $versionStrict) { throw "Apps DisplayVersion mismatch: $dispVer != $versionStrict" }
          $u = Start-Process -FilePath (Join-Path $checkDir 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstall exited with $($u.ExitCode)" }
          for ($i = 0; $i -lt 40 -and (Test-Path $checkDir); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $checkDir) { throw "Install directory still exists after uninstall" }
          if (Test-Path $regKey) { throw "Uninstall registry key still exists after uninstall" }

          # 3. Portable zip with empty submarine-data/ directory
          $stage = Join-Path $env:RUNNER_TEMP 'submarine-portable'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'submarine-data') | Out-Null
          Copy-Item $appExe $stage
          if (Test-Path 'packaging\windows\README-portable.txt') {
            Copy-Item 'packaging\windows\README-portable.txt' (Join-Path $stage 'README.txt')
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $outDir "Submarine-$version-windows-x86_64-portable.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip)
          Get-ChildItem $outDir

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-submarine-windows-x86_64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 5

  build-macos:
    name: Build macOS Universal (dmg + app.zip)
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SinaXhpm/Submarine
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: app-src
          persist-credentials: false

      - name: Checkout security patches from auto-builds
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: auto-builds
          persist-credentials: false

      - name: Verify and apply security hardening patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PATCHES=(auto-builds/patches/submarine/*.patch)
          if [ "${#PATCHES[@]}" -eq 0 ]; then
            echo "::error::未找到 Submarine 安全补丁"
            exit 1
          fi
          for patch in "${PATCHES[@]}"; do
            echo "Checking patch: $patch"
            git -C app-src apply --check "$PWD/$patch"
            git -C app-src apply "$PWD/$patch"
          done
          git -C app-src diff --exit-code src-tauri/Cargo.toml src-tauri/Cargo.lock package-lock.json

      - name: Setup Node 20 (no cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Rust stable (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Universal macOS app, ad-hoc sign, and package native hdiutil dmg + app.zip
        working-directory: ./app-src
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          VERSION_STRICT="${VERSION%%-*}"
          STAMP_VERSION="$VERSION_STRICT" node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = process.env.STAMP_VERSION;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
          '

          npm ci
          npx tauri build --target universal-apple-darwin --bundles app -- --locked
          git diff --exit-code src-tauri/Cargo.toml src-tauri/Cargo.lock package-lock.json

          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' | head -n 1)
          test -d "$APP"
          lipo "$APP/Contents/MacOS/submarine" -verify_arch arm64 x86_64

          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          mkdir -p ../release-assets
          ditto -c -k --keepParent "$APP" "../release-assets/Submarine-${VERSION}-macos-universal.app.zip"

          DMG_STAGE="$RUNNER_TEMP/submarine-dmg"
          rm -rf "$DMG_STAGE" && mkdir -p "$DMG_STAGE"
          cp -R "$APP" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          DMG="../release-assets/Submarine-${VERSION}-macos-universal.dmg"
          SIZE=$(( $(du -sm "$DMG_STAGE" | cut -f1) * 2 + 20 ))
          for attempt in 1 2 3; do
            hdiutil create -volname Submarine -srcfolder "$DMG_STAGE" -ov \
              -fs HFS+ -size "${SIZE}m" -format UDZO "$DMG" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          ls -la ../release-assets

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-submarine-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 5

  build-android:
    name: Build Android Unsigned Universal APK (16 KB aligned)
    needs: [check-version, validate-android-signing]
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SinaXhpm/Submarine
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: app-src
          persist-credentials: false

      - name: Checkout security patches from auto-builds
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: auto-builds
          persist-credentials: false

      - name: Verify and apply security hardening patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PATCHES=(auto-builds/patches/submarine/*.patch)
          if [ "${#PATCHES[@]}" -eq 0 ]; then
            echo "::error::未找到 Submarine 安全补丁"
            exit 1
          fi
          for patch in "${PATCHES[@]}"; do
            echo "Checking patch: $patch"
            git -C app-src apply --check "$PWD/$patch"
            git -C app-src apply "$PWD/$patch"
          done
          git -C app-src diff --exit-code src-tauri/Cargo.toml src-tauri/Cargo.lock package-lock.json

      - name: Setup Node 20 (no cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and NDK r28
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"

      - name: Point NDK environment and symlink legacy binutils names
        shell: bash
        run: |
          set -euo pipefail
          NDK_ROOT="$ANDROID_HOME/ndk/${NDK_VERSION}"
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -d "$NDK_BIN"
          for target in aarch64-linux-android armv7a-linux-androideabi arm-linux-androideabi; do
            for tool in ranlib ar strip nm objcopy objdump readelf; do
              link="$NDK_BIN/${target}-${tool}"
              [ -e "$link" ] || ln -sf "$NDK_BIN/llvm-${tool}" "$link"
            done
          done
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "$NDK_BIN" >> "$GITHUB_PATH"

      - name: Setup Rust stable (Android arm64 + armv7)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Build unsigned Android APK and verify 16 KB page alignment
        working-directory: ./app-src
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          STAMP_VERSION="$VERSION" node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = process.env.STAMP_VERSION;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
          '
          node scripts/android-version-code.mjs "$VERSION" --stamp src-tauri/tauri.conf.json

          npm ci
          npx tauri android build --apk --target aarch64 armv7 -- --locked
          git diff --exit-code src-tauri/Cargo.toml src-tauri/Cargo.lock package-lock.json

          if find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-release.apk' | grep -q .; then
            echo "::error::构建任务不应产出已签名 APK"
            exit 1
          fi
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-release-unsigned.apk' | head -n 1)
          test -s "$APK"

          mkdir -p ../android-build-input
          OUT="../android-build-input/Submarine-${VERSION}-android-universal-unsigned.apk"
          cp "$APK" "$OUT"
          node scripts/check-android-16k.mjs "$OUT"

      - name: Upload Android signing input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-input-submarine
          path: android-build-input/*.apk
          if-no-files-found: error
          retention-days: 1

  sign-android:
    name: Sign Android APK in isolated job
    needs: [check-version, build-android]
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android build tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'build-tools;36.0.0'

      - name: Download Android signing input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-build-input-submarine
          path: android-input

      - name: Verify 16 KB alignment, sign, and verify release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          SIGNING_DIR=$(mktemp -d)
          trap 'rm -rf "$SIGNING_DIR"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/release.jks"
          umask 022

          INPUT="android-input/Submarine-${VERSION}-android-universal-unsigned.apk"
          test -s "$INPUT"
          if "$ZIPALIGN" -c -P 16 4 "$INPUT" >/dev/null 2>&1; then
            cp "$INPUT" "$SIGNING_DIR/aligned.apk"
          else
            "$ZIPALIGN" -f -P 16 4 "$INPUT" "$SIGNING_DIR/aligned.apk"
          fi

          mkdir -p release-assets
          OUTPUT="release-assets/Submarine-${VERSION}-android-universal-release.apk"
          "$APKSIGNER" sign \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --ks "$SIGNING_DIR/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$OUTPUT" \
            "$SIGNING_DIR/aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT"
          "$ZIPALIGN" -c -P 16 4 "$OUTPUT"
          test -s "$OUTPUT"

      - name: Upload signed Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-submarine-android
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 5

  build-ios:
    name: Build iOS arm64 Unsigned IPA
    needs: check-version
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout immutable upstream commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SinaXhpm/Submarine
          ref: ${{ needs.check-version.outputs.upstream_sha }}
          path: app-src
          persist-credentials: false

      - name: Checkout security patches from auto-builds
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: auto-builds
          persist-credentials: false

      - name: Verify and apply security hardening patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PATCHES=(auto-builds/patches/submarine/*.patch)
          if [ "${#PATCHES[@]}" -eq 0 ]; then
            echo "::error::未找到 Submarine 安全补丁"
            exit 1
          fi
          for patch in "${PATCHES[@]}"; do
            echo "Checking patch: $patch"
            git -C app-src apply --check "$PWD/$patch"
            git -C app-src apply "$PWD/$patch"
          done
          git -C app-src diff --exit-code src-tauri/Cargo.toml src-tauri/Cargo.lock package-lock.json

      - name: Select newest Xcode (prefer Xcode 26)
        shell: bash
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$XC" ]; then
            XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          [ -n "$XC" ] || { echo "::error::未找到 Xcode"; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Setup Node 20 (no cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Rust stable (iOS arm64)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Build unsigned iOS arm64 IPA
        working-directory: ./app-src
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          VERSION_STRICT="${VERSION%%-*}"
          BUILD_NUM=$(date -u +%Y%m%d%H%M)

          STAMP_VERSION="$VERSION_STRICT" node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = process.env.STAMP_VERSION;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
          '

          npm ci
          if [ ! -d src-tauri/gen/apple ]; then
            npx tauri ios init --ci
          fi
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          mkdir -p src-tauri/gen/apple/Externals src-tauri/gen/apple/assets
          (cd src-tauri/gen/apple && xcodegen generate --spec project.yml)

          npx tauri ios build --ci --no-sign --export-method app-store-connect \
            --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"${BUILD_NUM}\"}}}" \
            -- --locked
          git diff --exit-code src-tauri/Cargo.toml src-tauri/Cargo.lock package-lock.json

          IPA=$(find src-tauri/gen/apple/build -maxdepth 3 -type f -name '*.ipa' | head -n 1)
          test -s "$IPA"
          mkdir -p ../release-assets
          cp "$IPA" "../release-assets/Submarine-${VERSION}-ios-arm64-unsigned.ipa"
          ls -la ../release-assets

      - name: Upload iOS unsigned IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-submarine-ios
          path: release-assets/*.ipa
          if-no-files-found: error
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: [check-version, archive-source, build-linux, build-windows, build-macos, sign-android, build-ios]
    if: needs.check-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Download source archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: source-*
          merge-multiple: true

      - name: Verify complete artifact manifest
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          VERSION="${UPSTREAM_TAG#v}"
          EXPECTED=(
            "submarine-${VERSION}-source.tar.gz"
            "Submarine-${VERSION}-linux-x86_64.tar.gz"
            "Submarine-${VERSION}-linux-x86_64.deb"
            "Submarine-${VERSION}-linux-x86_64.rpm"
            "Submarine-${VERSION}-linux-x86_64.AppImage"
            "Submarine-${VERSION}-windows-x86_64.msi"
            "Submarine-${VERSION}-windows-x86_64-setup.exe"
            "Submarine-${VERSION}-windows-x86_64-portable.zip"
            "Submarine-${VERSION}-macos-universal.dmg"
            "Submarine-${VERSION}-macos-universal.app.zip"
            "Submarine-${VERSION}-android-universal-release.apk"
            "Submarine-${VERSION}-ios-arm64-unsigned.ipa"
          )

          for name in "${EXPECTED[@]}"; do
            COUNT=$(find artifacts -type f -name "$name" | wc -l)
            if [ "$COUNT" -ne 1 ]; then
              echo "::error::产物 $name 的数量应为 1，实际为 $COUNT"
              exit 1
            fi
          done

          ACTUAL_COUNT=$(find artifacts -type f | wc -l)
          if [ "$ACTUAL_COUNT" -ne "${#EXPECTED[@]}" ]; then
            echo "::error::发现未列入清单的产物；预期 ${#EXPECTED[@]} 个，实际 $ACTUAL_COUNT 个"
            find artifacts -type f -print
            exit 1
          fi

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          CHECKSUM_FILE=$(mktemp)
          cd artifacts
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$CHECKSUM_FILE"
          mv "$CHECKSUM_FILE" SHA256SUMS
          test -s SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/**/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Submarine ${{ needs.check-version.outputs.upstream_tag }}
          draft: false
          prerelease: ${{ needs.check-version.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          body: |
            Automated hardened build of [SinaXhpm/Submarine ${{ needs.check-version.outputs.upstream_tag }}](https://github.com/SinaXhpm/Submarine/releases/tag/${{ needs.check-version.outputs.upstream_tag }}).

            Upstream commit: `${{ needs.check-version.outputs.upstream_sha }}`
            Hardening applied from `patches/submarine/` (startup update check & official feedback disabled, official cloud sync / AI assistant / MCP agent gateway disabled, `~/.ssh/config` defaulted off, `read_ssh_key_file` requires unlocked vault, FileZilla credential import disabled, SFTP/Mirror symlink boundary hardened, Gradle wrapper SHA-256 pinned).
            Android APK is 16 KB page-aligned and signed in an isolated job with this repository's persistent Android release certificate; iOS IPA is unsigned for self-signing/sideloading.
            SHA-256 checksums are included in `SHA256SUMS`; GitHub build provenance is attached to the artifacts.
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
